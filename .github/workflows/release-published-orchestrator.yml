name: Release Published Orchestrator

run-name: "🚀 Release Published ${{ inputs.tag || github.event.release.tag_name }}${{ inputs.dry_run && ' (Dry Run)' || '' }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if the workflow is triggered to create a dry-run release"
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: "The release id of the dry-run release"
        required: false
        type: string
      dry_run_zip_url:
        description: "URL of the dry-run zip release"
        required: false
        type: string
      dry_run_tar_gz_url:
        description: "URL of the dry-run tar.gz release"
        required: false
        type: string
      dry_run_branch_name:
        description: "The branch name of the dry-run"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release Tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if the workflow is triggered to create a dry-run release"
        required: true
        type: boolean
        default: false
      dry_run_release_id:
        description: "The release id of the dry-run release"
        required: false
        type: string
      dry_run_zip_url:
        description: "URL of the dry-run zip release"
        required: false
        type: string
      dry_run_tar_gz_url:
        description: "URL of the dry-run tar.gz release"
        required: false
        type: string
      dry_run_branch_name:
        description: "The branch name of the dry-run"
        required: false
        type: string

# Security: Minimal workflow-level permissions - called workflows define their own
permissions:
  contents: read

jobs:
  setup:
    name: Setup Release Metadata
    uses: ./.github/workflows/release-setup.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
      dry_run_branch_name: ${{ inputs.dry_run_branch_name || '' }}
    secrets: inherit

  manual-approval:
    name: Manual Deployment Approval
    needs: [setup]
    uses: ./.github/workflows/release-manual-approval.yml
    with:
      version: ${{ needs.setup.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}

  deploy-javadocs:
    name: Deploy Javadocs
    needs: [setup, manual-approval]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') }}
    uses: ./.github/workflows/release-deploy-javadocs.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.setup.outputs.tag }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [setup, manual-approval]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') }}
    uses: ./.github/workflows/release-publish-github-packages.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.setup.outputs.version }}
      latestMergeSha: ${{ needs.setup.outputs.latestMergeSha }}
      timeStamp: ${{ needs.setup.outputs.timeStamp }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  deploy-xsd:
    name: Deploy XSD Files
    needs: [setup, manual-approval]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') }}
    uses: ./.github/workflows/release-deploy-xsd.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.setup.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  release-docker:
    name: Release Docker Images
    needs: [setup, manual-approval, deploy-maven]
    # Skip on dry-run: docker-release.yml resolves SHA256 from
    # package.liquibase.com/.../liquibase-${version}.tar.gz, which only hosts GA
    # tarballs — a dry-run-${run_id} version yields a zero-byte archive and the
    # job intentionally exits 1. Docker builds are exercised by docker-test.yml
    # and build-qa-docker.yml; nothing else needs validating here on dry-run.
    if: ${{ !cancelled() && inputs.dry_run != true && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') && needs.deploy-maven.result == 'success' }}
    uses: ./.github/workflows/release-docker.yml
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      version: ${{ needs.setup.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  deploy-maven:
    name: Deploy to Maven Central
    needs: [setup, manual-approval, deploy-javadocs, publish-github-packages, deploy-xsd]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') && (needs.deploy-javadocs.result == 'success' || needs.deploy-javadocs.result == 'skipped') && (needs.publish-github-packages.result == 'success' || needs.publish-github-packages.result == 'skipped') && (needs.deploy-xsd.result == 'success' || needs.deploy-xsd.result == 'skipped') }}
    uses: ./.github/workflows/release-deploy-maven.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      version: ${{ needs.setup.outputs.version }}
      tag: ${{ needs.setup.outputs.tag }}
      dry_run: ${{ inputs.dry_run || false }}
      dry_run_release_id: ${{ inputs.dry_run_release_id || '' }}
    secrets: inherit

  package:
    name: Update Packages
    needs: [setup, manual-approval]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') }}
    uses: liquibase/build-logic/.github/workflows/package.yml@main
    permissions:
      actions: write
      contents: write
      issues: write
      packages: write
      pull-requests: write
      id-token: write
    secrets: inherit
    with:
      groupId: "org.liquibase"
      artifactId: "liquibase"
      version: ${{ needs.setup.outputs.version }}
      tag: ${{ needs.setup.outputs.tag }}
      dry_run: ${{ inputs.dry_run || false}}
      dry_run_zip_url: ${{ inputs.dry_run_zip_url || '' }}
      dry_run_tar_gz_url: ${{ inputs.dry_run_tar_gz_url || '' }}
      dry_run_release_id: ${{ inputs.dry_run_release_id || '' }}
      distribution: "liquibase"
      download_base_url: "https://github.com/liquibase/liquibase/releases/download"

  publish-assets-s3:
    name: Publish Assets to S3
    needs: [setup, manual-approval, package]
    # manual-approval is a direct dependency, not just an inherited one: when
    # approval is denied `package` is skipped, and accepting a skipped `package`
    # on its own would publish production assets past a rejected release.
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped') && (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    uses: ./.github/workflows/release-publish-assets-s3.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.setup.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  generate-summary:
    name: Generate Release Summary
    needs:
      [
        setup,
        manual-approval,
        deploy-javadocs,
        publish-github-packages,
        deploy-xsd,
        release-docker,
        deploy-maven,
        package,
        publish-assets-s3,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Orchestrator Summary
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          DRY_RUN="${{ inputs.dry_run || false }}"

          # Determine overall status.
          #
          # A stage counts as complete when it succeeded. Five of them are gated
          # on `dry_run == false`, either in the workflow they call (javadocs,
          # GitHub Packages, XSD, S3 assets) or in this file (docker), so on a
          # dry run they are skipped by design and `skipped` counts as complete
          # for them. On a real release every stage must actually succeed.
          FAILED_STAGES=""

          check_stage() {
            local name="$1" result="$2" skip_ok_on_dry_run="$3"
            if [ "$result" == "success" ]; then
              return 0
            fi
            if [ "$result" == "skipped" ] && [ "$skip_ok_on_dry_run" == "yes" ] && [ "$DRY_RUN" == "true" ]; then
              return 0
            fi
            FAILED_STAGES="${FAILED_STAGES:+$FAILED_STAGES, }$name"
          }

          check_stage "Setup"                   "${{ needs.setup.result }}"                   no
          check_stage "Deploy Javadocs"         "${{ needs.deploy-javadocs.result }}"         yes
          check_stage "Publish GitHub Packages" "${{ needs.publish-github-packages.result }}" yes
          check_stage "Deploy XSD Files"        "${{ needs.deploy-xsd.result }}"              yes
          check_stage "Release Docker Images"   "${{ needs.release-docker.result }}"          yes
          check_stage "Deploy to Maven Central" "${{ needs.deploy-maven.result }}"            no
          check_stage "Update Packages"         "${{ needs.package.result }}"                 no
          check_stage "Publish Assets to S3"    "${{ needs.publish-assets-s3.result }}"       yes

          if [ -z "$FAILED_STAGES" ]; then
            OVERALL_STATUS="✅ SUCCESS"
            STATUS_ICON="🎉"
          else
            OVERALL_STATUS="❌ FAILED"
            STATUS_ICON="💥"
          fi

          # Generate simplified summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # $STATUS_ICON Release Published: $OVERALL_STATUS

          **Version:** \`$VERSION\` | **Build:** $(date -u +"%Y-%m-%d %H:%M") | **Mode:** $([ "$DRY_RUN" == "true" ] && echo "🧪 Dry Run" || echo "🚀 Production")

          ## Pipeline Results
          | Stage | Status |
          |-------|--------|
          | Setup | ${{ needs.setup.result == 'success' && '✅' || '❌' }} |
          | Manual Approval | ${{ needs.manual-approval.result == 'success' && '✅' || needs.manual-approval.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Deploy Javadocs | ${{ needs.deploy-javadocs.result == 'success' && '✅' || needs.deploy-javadocs.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Publish GitHub Packages | ${{ needs.publish-github-packages.result == 'success' && '✅' || needs.publish-github-packages.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Deploy XSD Files | ${{ needs.deploy-xsd.result == 'success' && '✅' || needs.deploy-xsd.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Release Docker Images | ${{ needs.release-docker.result == 'success' && '✅' || needs.release-docker.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Deploy to Maven Central | ${{ needs.deploy-maven.result == 'success' && '✅' || needs.deploy-maven.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Update Packages | ${{ needs.package.result == 'success' && '✅' || needs.package.result == 'skipped' && '⏭️ Skipped' || '❌' }} |
          | Publish Assets to S3 | ${{ needs.publish-assets-s3.result == 'success' && '✅' || needs.publish-assets-s3.result == 'skipped' && '⏭️ Skipped' || '❌' }} |

          $(if [ "$OVERALL_STATUS" == "✅ SUCCESS" ]; then
          cat << 'SUCCESS'
          ## 🎯 Release Available

          **Repositories:**
          - Maven Central: [repo1.maven.org/maven2/org/liquibase/](https://repo1.maven.org/maven2/org/liquibase/)
          - GitHub Packages: [github.com/liquibase/liquibase/packages](https://github.com/liquibase/liquibase/packages)
          - Docker Hub: \`docker pull liquibase/liquibase:$VERSION\`
          - GitHub Release: [github.com/liquibase/liquibase/releases/tag/v$VERSION](https://github.com/liquibase/liquibase/releases/tag/v$VERSION)

          **Quick Start:**
          \`\`\`bash
          # Maven
          mvn org.liquibase:liquibase-maven-plugin:$VERSION:update

          # Docker
          docker pull liquibase/liquibase:$VERSION
          docker run liquibase/liquibase:$VERSION --version
          \`\`\`
          SUCCESS
          else
          cat << 'FAILURE'
          ## 🔧 Action Required

          **Failed Steps:** Check logs above for details
          **Next:** Fix issues and re-run failed workflows individually or restart orchestrator
          
          **Individual Workflow Triggers:**
          Each workflow can be manually triggered from the Actions tab if needed.
          FAILURE
          fi)
          EOF

          echo "📋 Release $VERSION: $OVERALL_STATUS"

          # Fail the run when a stage did not complete. Without this the summary
          # can report FAILED while the run itself goes green, because writing the
          # summary is the last thing this job does and it always exits 0. That is
          # how two skipped publish stages went unnoticed across several releases.
          if [ -n "$FAILED_STAGES" ]; then
            {
              echo ""
              echo "**Stages that did not complete:** $FAILED_STAGES"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Release $VERSION did not complete. Stages that did not complete: $FAILED_STAGES"
            exit 1
          fi
