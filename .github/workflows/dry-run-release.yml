name: Dry run release

# Security: These write permissions are required for dry-run release testing
# - actions: write - trigger downstream workflows
# - contents: write - create/delete dry-run releases
# - packages: write - test package publishing
# - id-token: write - AWS OIDC authentication
permissions:
  actions: write
  contents: write
  packages: write
  id-token: write

on:
  workflow_dispatch: # Trigger on demand
  schedule: # Trigger weekly all Wednesdays at midnight UTC
    # Trigger weekly on Wednesday at midnight Austin time (Standard Time)
    - cron: "0 6 * * 3"

jobs:
  # [TECHOPS-1223] create-release.yml now builds from a pinned commit SHA instead of
  # reusing another workflow run's uploaded artifact, so there is no run to scan for
  # anymore. This job, and the 20-run scan it used to do, is deleted outright.
  dry-run-create-release:
    runs-on: ubuntu-latest
    outputs:
      dry_run_zip_url: ${{ steps.wait_and_get_outputs.outputs.dry_run_zip_url }}
      dry_run_tar_gz_url: ${{ steps.wait_and_get_outputs.outputs.dry_run_tar_gz_url }}
      dry_run_release_id: ${{ steps.wait_and_get_outputs.outputs.dry_run_release_id }}
    steps:

      - name: Configure AWS credentials for the github-app-liquibase secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_GITHUB_APP_LIQUIBASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the GitHub App credentials from vault
        # TECHOPS-1295: /vault/grouped/github-app-liquibase holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/github-app-liquibase
          parse-json-secrets: true

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-actions: write

      - name: Invoke Create Release
        id: trigger-step
        uses: liquibase/build-logic/.github/actions/dispatch-and-wait@d12b38713b9a20a72f95468749ee5031137689a6 # main
        with:
          workflow: create-release.yml
          ref: main
          # caller_workflow lets create-release's green-SHA gate exclude THIS run.
          # This workflow dispatches create-release and then waits on it, so it is always
          # in flight on the same head_sha the gate judges. On the weekly schedule the
          # gate's `event != "schedule"` filter hid that; on workflow_dispatch nothing did,
          # so a manual dry run always failed with "still has workflows running: Dry run
          # release". See the gate comment in create-release.yml.
          inputs: '{"version": "dry-run-${{ github.run_id }}", "standalone_zip": "false", "dry_run": "true", "branch": "main", "caller_workflow": "${{ github.workflow }}"}'
          wait: 'true'
          gh-token: ${{ steps.get-token.outputs.token }}

      - name: Get Release Outputs
        id: wait_and_get_outputs
        run: |
          # Get release info based on draft name
          release_name="vdry-run-${{ github.run_id }}"
          echo "Looking for release with name: $release_name"
          
          response=$(curl -s -H "Authorization: token ${{ steps.get-token.outputs.token  }}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        "https://api.github.com/repos/liquibase/liquibase/releases")
          
          echo "API Response status code: $?"
          echo "API Response: $response"

          # Find the draft release and get its assets
          draft_release=$(echo "$response" | jq -r --arg name "$release_name" '.[] | select(.name == $name and .draft == true)')
          echo "Found draft release: $draft_release"
          
          if [ -z "$draft_release" ]; then
            echo "Error: No draft release found with name $release_name"
            exit 1
          fi
          
          assets_url=$(echo "$draft_release" | jq -r '.assets_url')
          dry_run_release_id=$(echo "$draft_release" | jq -r '.id')
          
          echo "Assets URL: $assets_url"
          echo "Release ID: $dry_run_release_id"

          # Get the assets
          assets_response=$(curl -s -H "Authorization: token ${{ steps.get-token.outputs.token  }}" \
                             -H "Accept: application/vnd.github.v3+json" \
                             "$assets_url")
          
          echo "Assets API Response status code: $?"
          echo "Assets API Response: $assets_response"

          # The zip keeps browser_download_url: nothing downloads it, it is only
          # surfaced in the summary and passed to consumers that ignore it.
          #
          # The tar.gz must use the asset API url. The ansible role deploy is the
          # only consumer that actually fetches it, and at this point the release is
          # still a draft, so browser_download_url is an untagged-<hash> path that
          # 404s for a token-authenticated client. The asset API url resolves with
          # the Accept: application/octet-stream + bearer token the role already
          # sends (TECHOPS-1205).
          dry_run_zip_url=$(echo "$assets_response" | jq -r '.[] | select(.name | test("^liquibase-dry-run-.*\\.zip$")) | .browser_download_url')
          dry_run_tar_gz_url=$(echo "$assets_response" | jq -r '.[] | select(.name | test("^liquibase-dry-run-.*\\.tar\\.gz$")) | .url')

          echo "Found zip URL: $dry_run_zip_url"
          echo "Found tar.gz URL: $dry_run_tar_gz_url"

          # Remove any newlines or spaces from URLs before setting outputs
          dry_run_zip_url=$(echo "$dry_run_zip_url" | tr -d '[:space:]')
          dry_run_tar_gz_url=$(echo "$dry_run_tar_gz_url" | tr -d '[:space:]')

          if [ -z "$dry_run_zip_url" ] || [ -z "$dry_run_tar_gz_url" ]; then
            echo "Error: Could not find both zip and tar.gz assets"
            exit 1
          fi

          echo "dry_run_release_id Id is $dry_run_release_id"
          echo "dry_run_tar_gz_url is $dry_run_tar_gz_url"
          echo "dry_run_zip_url is $dry_run_zip_url"

          echo "dry_run_tar_gz_url=$dry_run_tar_gz_url" >> $GITHUB_OUTPUT
          echo "dry_run_zip_url=$dry_run_zip_url" >> $GITHUB_OUTPUT
          echo "dry_run_release_id=$dry_run_release_id" >> $GITHUB_OUTPUT

      - name: Add to Job Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Dry-Run Release Summary

          ### Release Details
          | Property | Value |
          |----------|-------|
          | **Version** | \`dry-run-${{ github.run_id }}\` |
          | **Tag** | \`vdry-run-${{ github.run_id }}\` |
          | **Release ID** | \`${{ steps.wait_and_get_outputs.outputs.dry_run_release_id }}\` |

          ### Assets
          | Asset | URL |
          |-------|-----|
          | **ZIP** | ${{ steps.wait_and_get_outputs.outputs.dry_run_zip_url }} |
          | **TAR.GZ** | ${{ steps.wait_and_get_outputs.outputs.dry_run_tar_gz_url }} |

          ### Build Source
          | Property | Value |
          |----------|-------|
          | **Branch** | \`${{ github.ref_name }}\` |

          ### Triggered Workflows
          | Workflow | Link |
          |----------|------|
          | **create-release** | [View Runs](https://github.com/${{ github.repository }}/actions/workflows/create-release.yml) |
          | **release-published-orchestrator** | [View Runs](https://github.com/${{ github.repository }}/actions/workflows/release-published-orchestrator.yml) |
          EOF

  dry-run-release-published:
    needs: [dry-run-create-release]
    runs-on: ubuntu-latest
    steps:

      - name: Configure AWS credentials for the github-app-liquibase secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_GITHUB_APP_LIQUIBASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the GitHub App credentials from vault
        # TECHOPS-1295: /vault/grouped/github-app-liquibase holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/github-app-liquibase
          parse-json-secrets: true

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-actions: write

      - name: Trigger release-published-orchestrator workflow
        uses: liquibase/build-logic/.github/actions/dispatch-and-wait@d12b38713b9a20a72f95468749ee5031137689a6 # main
        with:
          workflow: release-published-orchestrator.yml
          ref: main
          inputs: '{"tag": "vdry-run-${{ github.run_id }}", "dry_run_release_id": "${{ needs.dry-run-create-release.outputs.dry_run_release_id }}", "dry_run_zip_url": "${{ needs.dry-run-create-release.outputs.dry_run_zip_url }}", "dry_run_tar_gz_url": "${{ needs.dry-run-create-release.outputs.dry_run_tar_gz_url }}", "dry_run": true, "dry_run_branch_name": "${{ github.ref_name }}"}'
          wait: 'true'
          gh-token: ${{ steps.get-token.outputs.token }}

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [dry-run-create-release, dry-run-release-published]
    steps:
      # [TECHOPS-1223] The checkout, the git identity and the tag deletion that used to
      # live here are gone. They existed to remove `vdry-run-<run_id>`, which the old
      # create-release.yml created with `git tag -f "v${VERSION}"` during a dry run.
      # The release is now attached with `draft: true`, which creates no git ref, and
      # `tag-release` is gated on `dry_run == false`, so a dry run never makes a tag.
      # Left in place, `git push origin --delete` would fail on a ref that does not
      # exist and take the weekly cron red. Dropping the checkout also stops persisting
      # a credential on disk for a job that only needs the API call below.
      - name: Delete the dry-run draft release
        if: always()
        run: |
          curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/${{ needs.dry-run-create-release.outputs.dry_run_release_id}}"

  notify:
    if: failure()
    runs-on: ubuntu-latest
    needs: [dry-run-create-release, dry-run-release-published, cleanup]
    steps:

      - name: Configure AWS credentials for the dry-run-slack-bot-token secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_DRY_RUN_SLACK_BOT_TOKEN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the dry-run Slack bot token from vault
        # TECHOPS-1295: /vault/grouped/dry-run-slack-bot-token holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/dry-run-slack-bot-token
          parse-json-secrets: true

      # Next group, next role: this assume replaces the previous one for the rest of the job.
      - name: Configure AWS credentials for the dryrun-releases-slack-id secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_DRYRUN_RELEASES_SLACK_ID_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the dry-run Slack channel id from vault
        # TECHOPS-1295: /vault/grouped/dryrun-releases-slack-id holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/dryrun-releases-slack-id
          parse-json-secrets: true

      - name: Notify Slack on Build Failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.DRY_RUN_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.DRYRUN_RELEASES_SLACK_ID }}
            username: "liquibot"
            icon_emoji: ":robot_face:"
            link_names: true
            attachments:
              - color: "danger"
                title: "❌ ${{ github.repository }} ❌ Build failed on branch ${{ github.ref }} for commit ${{ github.sha }}"
                text: "View details on GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} <@U040C8J8143> <@U04P39MS2SW> <@UHHJ6UAEQ> <@U042HRTL4DT>"
                footer: "${{ github.repository }}"
