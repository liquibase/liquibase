name: CI Test

# Reusable unit + integration test matrix. Called by pr.yml (every PR, no
# secrets) and main.yml (trusted). It declares no secrets and needs none: the
# only token it sees is the caller's GITHUB_TOKEN, which is read-only on fork
# and Dependabot PRs. Runs at the caller's GITHUB_SHA. [TECHOPS-1104]

on:
  workflow_call:
    inputs:
      upload_build_artifacts:
        description: Upload built jars and jacoco reports for downstream jobs (main.yml only)
        type: boolean
        default: false
      archive_test_results:
        description: Archive surefire reports as run artifacts
        type: boolean
        default: false

permissions:
  contents: read
  packages: read # pom `remote-repositories` profile resolves through GitHub Packages when CI=true

env:
  GITHUB_TOKEN: ${{ github.token }} # setup-java server-id credentials for GitHub Packages
  MAVEN_BUILD_ARGS: >-
    -Dbuild.repository.owner=liquibase
    -Dbuild.repository.name=liquibase
    -Dbuild.branch=${{ github.head_ref || github.ref_name }}
    -Dbuild.number=${{ github.run_number }}
    -Dbuild.commit=${{ github.sha }}

jobs:
  unit:
    name: Unit (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15-intel, windows-latest ]
        java: [ 17, 21, 25 ]
        exclude:
          - os: windows-latest
            java: 17
          - os: macos-15-intel
            java: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
          server-id: liquibase

      - name: Build & Test
        shell: bash
        run: |
          # shellcheck disable=SC2086 # MAVEN_BUILD_ARGS is intentionally word-split
          ./mvnw -B $MAVEN_BUILD_ARGS -DtrimStackTrace=false -P 'skip-integration-tests' clean test package surefire-report:report

      - name: Upload built jars
        if: ${{ inputs.upload_build_artifacts && matrix.java == 17 && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-artifact
          path: |
            ./**/target/*.jar
            !./**/target/original-*.jar

      - name: Upload jacoco report
        if: ${{ inputs.upload_build_artifacts && matrix.java == 17 && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-jacoco-test-results
          path: ./liquibase-standard/target/jacoco.exec

      - name: Archive test results
        if: ${{ inputs.archive_test_results }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-test-results-jdk${{ matrix.java }}-${{ matrix.os }}
          path: |
            ./**/target/surefire-reports
            ./**/target/site

  integration:
    name: Integration (${{ matrix.testSystem }})
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        testSystem:
          - db2
          - h2
          - hsqldb
          - mariadb
          - mssql
          - mysql
          - oracle
          - postgresql
          - sqlite
          - firebird
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: liquibase

      - name: Run integration tests
        run: |
          ./mvnw -B clean verify -DtrimStackTrace=false \
            -Dliquibase.sdk.testSystem.test=${{ matrix.testSystem }} \
            -Dliquibase.sdk.testSystem.acceptLicenses=${{ matrix.testSystem }} \
            -Dtest=*IntegrationTest,*ExecutorTest \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dsurefire.failIfNoTests=false

      - name: Upload integration jacoco report
        if: ${{ inputs.upload_build_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-integration-jacoco-test-results-${{ matrix.testSystem }}
          path: ./liquibase-integration-tests/target/jacoco.exec

      - name: Archive test results
        if: ${{ inputs.archive_test_results }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-test-results-integration-${{ matrix.testSystem }}
          path: ./**/target/surefire-reports
