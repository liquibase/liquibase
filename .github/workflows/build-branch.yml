name: Build Branch SNAPSHOT

# concurrent runs for pull requests (both internal and forked) will be canceled when a new run is triggered.
# It does not specifically target or exclude the 'main' branch; it cancels concurrent runs whenever a pull request is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:

  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

  push:
    branches:
      - github-action-**
    paths-ignore:
      - '**.md'

jobs:

  authorize:
    # Trusted context only: skip fork PRs so they never reach the `build` job's
    # packages:write deploy of fork-authored code.
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: true

  setup:
    name: Setup
    needs: authorize
    runs-on: ubuntu-22.04
    outputs:
      timeStamp: ${{ steps.get-timestamp.outputs.timestamp }}
      thisBranchName: ${{ steps.get-branch-name.outputs.thisBranchName }}
      latestMergeSha: ${{ steps.get-sha.outputs.latestMergeSha }}
      setupSuccessful: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after}}

      - name: Get Latest Merge Commit SHA
        id: get-sha
        run: |
          latest_merge_sha=`(git rev-parse HEAD)`
          echo "latestMergeSha=${latest_merge_sha}" >> $GITHUB_OUTPUT

      - name: Get Timestamp
        id: get-timestamp
        run: |
          timeStamp=$(date +'%Y-%m-%d %H:%M:%S %Z')
          echo "timestamp=${timeStamp}" >> $GITHUB_OUTPUT

      - name: Get Current BranchName
        id: get-branch-name
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # this logic checks if the branch is from a forked repository PR or not. Where -n is the inverse of -z (not empty)
          if [ -n "${GITHUB_HEAD_REF}" ];
          then
            branch_name=${GITHUB_HEAD_REF}
          else
            branch_name=$REF_NAME
          fi

          modified_branch_name=$(echo $branch_name | tr '/' '_')
          echo "thisBranchName=$modified_branch_name" >> $GITHUB_OUTPUT          

  build:
    name: Build & Package
    runs-on: ubuntu-22.04
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after}}
      - name: Set up Java for publishing to GitHub Repository
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: liquibase

      # Version artifact based off of branch and commit SHA.
      - name: Version Artifact
        env:
          BRANCH_NAME: ${{ needs.setup.outputs.thisBranchName }}
        run: |
          ./mvnw versions:set "-DnewVersion=$BRANCH_NAME-SNAPSHOT"

      # Publish to GitHub Packages
      - name: Publish package
        run: |
          ./mvnw -B clean deploy -pl '!liquibase-dist' -DskipTests=true "-Dbuild.repository.owner=liquibase" "-Dbuild.repository.name=liquibase" "-Dbuild.branch=$BRANCH_NAME" "-Dbuild.number=${{ github.run_number }}" "-Dbuild.commit=$MERGE_SHA" "-Dbuild.timestamp=$BUILD_TIMESTAMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ needs.setup.outputs.thisBranchName }}
          MERGE_SHA: ${{ needs.setup.outputs.latestMergeSha }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.timeStamp }}
