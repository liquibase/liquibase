name: Docker Release

run-name: "Docker Release - v${{ inputs.liquibaseVersion }}${{ inputs.dryRun && ' (Dry Run)' || '' }}"

on:
  workflow_call:
    inputs:
      liquibaseVersion:
        description: "Liquibase version to release (e.g. 5.0.2)"
        required: true
        type: string
      dryRun:
        description: "Dry run — skip pushes and commits"
        required: false
        type: boolean
        default: false
      pushDockerHub:
        description: "Push to Docker Hub"
        required: false
        type: boolean
        default: true
      pushGHCR:
        description: "Push to GitHub Container Registry"
        required: false
        type: boolean
        default: true
      pushECR:
        description: "Push to Amazon ECR Public"
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      liquibaseVersion:
        description: "Liquibase version to release (e.g. 5.0.2)"
        required: true
        type: string
      dryRun:
        description: "Dry run — skip pushes and commits"
        required: false
        type: boolean
        default: false
      pushDockerHub:
        description: "Push to Docker Hub"
        required: false
        type: boolean
        default: true
      pushGHCR:
        description: "Push to GitHub Container Registry"
        required: false
        type: boolean
        default: true
      pushECR:
        description: "Push to Amazon ECR Public"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # ── Step 1: Bump LIQUIBASE_VERSION ARG in Dockerfiles, commit to main ────────
  update-dockerfiles:
    name: Update Dockerfile versions
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksums.outputs.sha256 }}
      minor_version: ${{ steps.parse-version.outputs.minor_version }}
    steps:
      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1107: aws-secretsmanager-get-secrets can only load a secret whole, so
        # parse-json-secrets: true put every credential in /vault/liquibase into this
        # job's environment; read only the two App keys the token mint below needs.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in LIQUIBASE_GITHUB_APP_ID LIQUIBASE_GITHUB_APP_PRIVATE_KEY; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.get-token.outputs.token }}
          ref: main

      - name: Resolve SHA256 checksums for ${{ inputs.liquibaseVersion }}
        id: checksums
        env:
          LB_VERSION: "${{ inputs.liquibaseVersion }}"
        run: |
          SHA256=$(curl -fsSL "https://package.liquibase.com/downloads/dockerhub/official/liquibase-${LB_VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)
          if [ -z "$SHA256" ] || [ "$SHA256" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
            echo "::error::SHA256 resolution failed — empty or zero-byte archive for version ${LB_VERSION}"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Derive major.minor version
        id: parse-version
        env:
          LB_VERSION: "${{ inputs.liquibaseVersion }}"
        run: |
          MINOR=$(echo "$LB_VERSION" | awk -F. '{print $1"."$2}')
          echo "minor_version=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Update LIQUIBASE_VERSION in Dockerfiles
        env:
          LB_VERSION: "${{ inputs.liquibaseVersion }}"
          LB_SHA256: "${{ steps.checksums.outputs.sha256 }}"
        run: |
          sed -i "s/^ARG LIQUIBASE_VERSION=.*/ARG LIQUIBASE_VERSION=${LB_VERSION}/" docker/Dockerfile docker/Dockerfile.alpine
          sed -i "s/^ARG LB_SHA256=.*/ARG LB_SHA256=${LB_SHA256}/" docker/Dockerfile docker/Dockerfile.alpine

      - name: Commit and push version bump
        if: ${{ !inputs.dryRun }}
        env:
          LB_VERSION: "${{ inputs.liquibaseVersion }}"
        run: |
          git config user.name "liquibase-github-app[bot]"
          git config user.email "liquibase-github-app[bot]@users.noreply.github.com"
          git add docker/Dockerfile docker/Dockerfile.alpine
          git diff --cached --quiet || git commit -m "chore(docker): bump Liquibase version to ${LB_VERSION}"
          git push

  # ── Step 2a: Build community (ubuntu) image ───────────────────────────────────
  build-community:
    name: Build community image
    needs: [update-dockerfiles]
    uses: liquibase/build-logic/.github/workflows/reusable-docker-build.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build_context: docker/
      dockerfile_path: docker/Dockerfile
      image_name: liquibase/liquibase
      suffix: ""
      version: ${{ inputs.liquibaseVersion }}
      minor_version: ${{ needs.update-dockerfiles.outputs.minor_version }}
      latest_tag: "latest"
      push_dockerhub: ${{ inputs.pushDockerHub && !inputs.dryRun }}
      push_ghcr: ${{ inputs.pushGHCR && !inputs.dryRun }}
      push_ecr: ${{ inputs.pushECR && !inputs.dryRun }}
      dockerhub_repo: liquibase/liquibase
      ghcr_repo: ghcr.io/liquibase/liquibase
      ecr_repo: public.ecr.aws/liquibase/liquibase
      dry_run: ${{ inputs.dryRun || false }}
      build_args: |
        LIQUIBASE_VERSION=${{ inputs.liquibaseVersion }}
        LB_SHA256=${{ needs.update-dockerfiles.outputs.sha256 }}
      image_source_url: https://github.com/${{ github.repository }}
      image_description: Liquibase Container Image
      image_licenses: FSL-1.1-ALv2
    secrets: inherit

  # ── Step 2b: Build Alpine image ───────────────────────────────────────────────
  build-alpine:
    name: Build alpine image
    needs: [update-dockerfiles]
    uses: liquibase/build-logic/.github/workflows/reusable-docker-build.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build_context: docker/
      dockerfile_path: docker/Dockerfile.alpine
      image_name: liquibase/liquibase
      suffix: "-alpine"
      version: ${{ inputs.liquibaseVersion }}
      minor_version: ${{ needs.update-dockerfiles.outputs.minor_version }}
      latest_tag: "alpine"
      push_dockerhub: ${{ inputs.pushDockerHub && !inputs.dryRun }}
      push_ghcr: ${{ inputs.pushGHCR && !inputs.dryRun }}
      push_ecr: ${{ inputs.pushECR && !inputs.dryRun }}
      dockerhub_repo: liquibase/liquibase
      ghcr_repo: ghcr.io/liquibase/liquibase
      ecr_repo: public.ecr.aws/liquibase/liquibase
      dry_run: ${{ inputs.dryRun || false }}
      build_args: |
        LIQUIBASE_VERSION=${{ inputs.liquibaseVersion }}
        LB_SHA256=${{ needs.update-dockerfiles.outputs.sha256 }}
      image_source_url: https://github.com/${{ github.repository }}
      image_description: Liquibase Container Image (Alpine)
      image_licenses: FSL-1.1-ALv2
    secrets: inherit

  # ── Step 3: Publish both images ───────────────────────────────────────────────
  publish-release:
    name: Publish release
    needs: [update-dockerfiles, build-community, build-alpine]
    uses: liquibase/build-logic/.github/workflows/reusable-docker-publish.yml@main
    permissions:
      contents: write
    with:
      release_type: liquibase-release
      version: ${{ inputs.liquibaseVersion }}
      tag_suffix: ""
      reuse_existing_release: true
      image_name: liquibase/liquibase
      minor_version: ${{ needs.update-dockerfiles.outputs.minor_version }}
      latest_tag: "latest"
      # Alpine variants also published by build-alpine; list them explicitly so
      # the Release body covers every published tag for this version.
      extra_tags: |
        liquibase/liquibase:${{ inputs.liquibaseVersion }}-alpine
        liquibase/liquibase:${{ needs.update-dockerfiles.outputs.minor_version }}-alpine
        liquibase/liquibase:alpine
      dry_run: ${{ inputs.dryRun || false }}
    secrets: inherit
