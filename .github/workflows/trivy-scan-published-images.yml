# Vulnerability scanning for published Docker images
# This workflow scans published images on Docker Hub for vulnerabilities
# using the reusable vulnerability scanning workflow from build-logic.
#
# Every active semver tag is scanned on every run (max_tags_to_scan defaults to
# "all"). The job used to cover only the 10 newest tags, so anything older kept
# whatever its last scan produced: for three months that was a June run with no
# Grype output, which the CVE Library rendered as "Clean" (TECHOPS-1253).
#
# NOTE: SARIF results are NOT uploaded to GitHub Security tab to avoid stale alerts.
# Published image vulnerabilities are tracked via workflow artifacts and GitHub Actions summary.
# Only the main branch workflow (trivy.yml) populates the Security tab.

name: Published Images Vulnerability Scanning

on:
  workflow_dispatch:
    inputs:
      max_tags_to_scan:
        description: "Number of newest published tags to scan, or \"all\""
        required: false
        default: "all"
  schedule:
    # Run Monday-Friday at 10 AM UTC (published image monitoring)
    - cron: "0 10 * * 1-5"

concurrency:
  group: scan-results-writer
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write
  packages: read
  security-events: write

jobs:
  generate-matrix:
    name: Generate Scan Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      # Scheduled runs have no inputs, so they scan everything too. Needs the
      # build-logic matrix script that understands "all" (build-logic PR noted
      # in the TECHOPS-1253 PR that made this change).
      MAX_TAGS: ${{ github.event.inputs.max_tags_to_scan || 'all' }}
    steps:
      - name: Checkout build-logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs no networked git command, so the token does not need to
          # sit in .git/config. [TECHOPS-1111]
          persist-credentials: false
          repository: liquibase/build-logic
          path: build-logic

      # This repo owns the community image family and only that one; the
      # liquibase-secure matrix is generated in liquibase-pro so the two never
      # double-scan or double-write scan-results (TECHOPS-408). The scope used
      # to be hardcoded in a per-repo copy of the script; it is now declared
      # here, at the call site (TECHOPS-1086).
      - name: Generate matrix for all image/tag combinations
        id: set-matrix
        run: |
          SCRIPT=build-logic/scripts/vulnerability-scanning/generate-dockerhub-matrix.sh
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing. This repo uses the shared copy from liquibase/build-logic (build-logic#678); it must be merged first."
            exit 1
          fi
          chmod +x "$SCRIPT"
          "$SCRIPT" liquibase/liquibase

  vulnerability-scan:
    name: Scan ${{ matrix.image }}:${{ matrix.tag }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: liquibase/build-logic/.github/workflows/reusable-vulnerability-scan.yml@main
    with:
      mode: docker
      source: "${{ matrix.ref }}:${{ matrix.tag }}"
      image_name: ${{ matrix.image }}
      image_tag: ${{ matrix.tag }}
      fail_on_vulnerabilities: false
      upload_sarif: false
      generate_sbom: true
      vex_enabled: false
      # Community images have no VEX coverage and do not feed the auto-assess
      # pipeline (VEX assessments only apply to liquibase-secure scans in
      # liquibase-pro). Skip CVE dispatch entirely. [TECHOPS-408]
      dispatch_new_cves: false
      run_osv: true  # TECHOPS-410 Phase-1 dual-run; output is artifact-only, does not gate
      build_logic_ref: main
    secrets: inherit

  persist-results:
    name: Persist Scan Results
    needs: [generate-matrix, vulnerability-scan]
    if: always() && needs.vulnerability-scan.result != 'cancelled'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # persist-scan-results.sh pushes to the scan-results branch with this
          # checkout's token. [TECHOPS-1111]
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout build-logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: liquibase/build-logic
          path: build-logic

      - name: Download all scan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: scan-artifacts
          pattern: vulnerability-report-*

      - name: Persist to scan-results branch
        env:
          EXPECTED_MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SCRIPT=build-logic/scripts/vulnerability-scanning/persist-scan-results.sh
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing. This repo uses the shared copy from liquibase/build-logic (build-logic#678); it must be merged first."
            exit 1
          fi
          chmod +x "$SCRIPT"
          "$SCRIPT" scan-artifacts
