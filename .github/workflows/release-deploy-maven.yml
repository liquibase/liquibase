name: Release Deploy Maven

run-name: "Deploy to Maven Central - v${{ inputs.version }}${{ inputs.dry_run && ' (Dry Run)' || '' }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run deployment"
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: "The release id of the dry-run release"
        required: false
        type: string
        default: ""
      dry_run_assets_url:
        description: "URL pattern for downloading dry-run release assets"
        required: false
        type: string
        default: ""

      approved:
        description: "True only when release-published-orchestrator has already cleared the manual-approval gate for this run."
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run deployment"
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: "The release id of the dry-run release"
        required: false
        type: string
        default: ""
      dry_run_assets_url:
        description: "URL pattern for downloading dry-run release assets"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write

env:
  MAVEN_VERSION: "3.9.2"

jobs:
  deploy-maven-production:
    name: Deploy to Maven Central (Production)
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == false }}
    # `approved` is `workflow_call`-only, so a direct dispatch cannot claim it and still meets the
    # reviewers on `release`. An orchestrated run cleared that gate once already.
    # Keep it that way: on `workflow_dispatch` anyone who can dispatch could pick `release-publish`,
    # and a non-`boolean` input would do it silently because the string "false" is truthy.
    environment:
      name: ${{ inputs.approved && 'release-publish' || 'release' }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo liquibase/liquibase --dir "."

      - name: Configure AWS credentials for the gpg-signing secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_GPG_SIGNING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the GPG signing key from vault
        # TECHOPS-1295: /vault/grouped/gpg-signing holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/gpg-signing
          parse-json-secrets: true

      # Next group, next role: this assume replaces the previous one for the rest of the job.
      - name: Configure AWS credentials for the sonatype secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_SONATYPE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the Maven Central credentials from vault
        # TECHOPS-1295: /vault/grouped/sonatype holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/sonatype
          parse-json-secrets: true

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: sonatype-nexus-staging
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ env.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ env.SONATYPE_TOKEN }}
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
        run: |
          version=${{ inputs.version }}

          unzip -j liquibase-additional-*.zip

          ##extracts and sign poms, generate checksums for all artifacts
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            unzip -j $i-${version}.jar META-INF/maven/org.liquibase/$i/pom.xml
            sed -i -e "s/<version>\(release\|main\)-SNAPSHOT<\/version>/<version>${version}<\/version>/" pom.xml
            mv pom.xml $i-${version}.pom

            # Sign POM file
            gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab $i-${version}.pom

            # Generate checksums for POM file
            md5sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.md5
            sha1sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha1
            sha256sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha256

            # Sign and checksum every JAR here rather than reusing the sidecars
            # from liquibase-additional-*.zip. Those are produced when artifacts
            # are attached to the draft release, which can be days before the
            # release is published. If the signing key rotates in that window the
            # baked-in .asc files are signed by a key that no longer verifies and
            # Central rejects the whole bundle. Signing at publish time always
            # uses the key currently in the vault.
            #
            # .sha256 also has to be regenerated because the sidecars produced by
            # sign-artifacts.sh carry a trailing space that Sonatype Central
            # Portal rejects as "Invalid sha256 checksum".
            for jar_file in $i-${version}.jar $i-${version}-sources.jar $i-${version}-javadoc.jar; do
              if [ -f "$jar_file" ]; then
                rm -f "$jar_file.asc"
                gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab "$jar_file"
                md5sum "$jar_file" | cut -d' ' -f1 > "$jar_file.md5"
                sha1sum "$jar_file" | cut -d' ' -f1 > "$jar_file.sha1"
                sha256sum "$jar_file" | cut -d' ' -f1 > "$jar_file.sha256"
              fi
            done
          done

          # Create Maven repository layout structure for the bundle
          mkdir -p "bundle/org/liquibase"

          # Copy all artifacts to proper Maven repository layout
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            mkdir -p "bundle/org/liquibase/$i/${version}"
            cp $i-${version}* "bundle/org/liquibase/$i/${version}/"
          done

          # Create the bundle zip file
          cd bundle
          zip -r ../central-bundle.zip .
          cd ..

          # Create base64 encoded credentials for Bearer auth
          AUTH_HEADER=$(printf "%s:%s" "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 -w 0)

          # Upload bundle to Central Portal with AUTOMATIC publishing
          echo "Uploading bundle to Central Portal for liquibase-${version}..."
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${AUTH_HEADER}" \
            -F "bundle=@central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=liquibase-${version}")

          # Parse response
          HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
          DEPLOYMENT_ID=$(echo "$UPLOAD_RESPONSE" | head -n1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Deployment ID: $DEPLOYMENT_ID"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "Upload failed with HTTP status $HTTP_CODE"
            echo "Response: $DEPLOYMENT_ID"
            exit 1
          fi

          echo "Bundle accepted by Central Portal"
          echo "Deployment ID: $DEPLOYMENT_ID"

          # A 201 only means Central accepted the bundle for processing. Validation
          # runs asynchronously afterwards, so poll until it resolves. Without this
          # the job goes green on a release that Central actually rejected.
          echo "Waiting for Central Portal validation of ${DEPLOYMENT_ID}..."
          STATE="UNKNOWN"
          for attempt in $(seq 1 60); do
            STATUS_JSON=$(curl -s -X POST \
              -H "Authorization: Bearer ${AUTH_HEADER}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
            STATE=$(echo "$STATUS_JSON" | jq -r '.deploymentState // "UNKNOWN"')
            echo "  [${attempt}/60] ${STATE}"

            case "$STATE" in
              PUBLISHED)
                echo "liquibase-${version} published to Maven Central"
                exit 0
                ;;
              FAILED)
                echo "Central Portal rejected the deployment:"
                echo "$STATUS_JSON" | jq -r '.errors // .'
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "Timed out after 30m waiting for ${DEPLOYMENT_ID} (last state: ${STATE})"
          echo "Check https://central.sonatype.com/publishing/deployments"
          exit 1

  deploy-maven-dryrun:
    name: Deploy to Nexus (Dry Run)
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == true }}
    # TECHOPS-1416: a dry run publishes to our internal Nexus, never to Maven Central.
    # The rehearsal still signs every file with the key a real release would use and
    # deploys the same poms and jars, so a broken key or a bad pom fails here first.
    # A SNAPSHOT left in a release jar, the one thing Central caught that Nexus would
    # not, is refused earlier by create-release.yml.
    #
    # TECHOPS-1295: the gpg-signing and repo-liquibase-net roles only trust the release
    # environments from this repository. `release-publish` has 0 reviewers, so the weekly
    # rehearsal still runs unattended; the environment's branch policy keeps it to main
    # and v* tags.
    environment:
      name: release-publish
    steps:
      - name: Download dry-run release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh CLI which handles draft release auth correctly
          gh release download "${{ inputs.tag }}" \
            --repo liquibase/liquibase \
            --pattern "*" \
            --dir "."

      - name: Configure AWS credentials for the gpg-signing secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_GPG_SIGNING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the GPG signing key from vault
        # TECHOPS-1295: /vault/grouped/gpg-signing holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/gpg-signing
          parse-json-secrets: true

      # Next group, next role: this assume replaces the previous one for the rest of the job.
      - name: Configure AWS credentials for the repo-liquibase-net secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_REPO_LIQUIBASE_NET_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the Nexus credentials from vault
        # TECHOPS-1295: /vault/grouped/repo-liquibase-net holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/repo-liquibase-net
          parse-json-secrets: true

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up Java for publishing to Nexus
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: dry-run-sonatype-nexus-staging
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      - name: Publish to Nexus (Dry Run)
        # Fully-qualified goal, as in create-release.yml: a plugin prefix makes Maven fetch
        # metadata from Central first, and a 429 there fails the deploy. [TECHOPS-1222]
        env:
          MAVEN_USERNAME: ${{ env.REPO_LIQUIBASE_NET_USER }}
          MAVEN_PASSWORD: ${{ env.REPO_LIQUIBASE_NET_PASSWORD }}
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
          VERSION: ${{ inputs.version }}
          NEXUS_URL: https://repo.liquibase.net/repository/dry-run-sonatype-nexus-staging/
        run: |
          set -euo pipefail

          unzip -j liquibase-additional-*.zip

          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            unzip -j "$i-$VERSION.jar" "META-INF/maven/org.liquibase/$i/pom.xml"
            sed -i -e "s/<version>\(release\|main\)-SNAPSHOT<\/version>/<version>${VERSION}<\/version>/" pom.xml
            mv pom.xml "$i-$VERSION.pom"

            # Signed at publish time rather than reusing the .asc files from the additional
            # zip, for the same reason as the production job: the key in the vault today is
            # the one a release would sign with.
            for f in "$i-$VERSION.pom" "$i-$VERSION.jar" "$i-$VERSION-sources.jar" "$i-$VERSION-javadoc.jar"; do
              rm -f "$f.asc"
              gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab "$f"
            done

            # -Dextension=jar: the plugin's packaging is maven-plugin, and its file is still a jar.
            mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.2.0:deploy-file \
              -Durl="$NEXUS_URL" \
              -DrepositoryId=dry-run-sonatype-nexus-staging \
              -DpomFile="$i-$VERSION.pom" \
              -DgeneratePom=false \
              -Dfile="$i-$VERSION.jar" \
              -Dextension=jar \
              -Dsources="$i-$VERSION-sources.jar" \
              -Djavadoc="$i-$VERSION-javadoc.jar" \
              -Dfiles="$i-$VERSION.jar.asc,$i-$VERSION-sources.jar.asc,$i-$VERSION-javadoc.jar.asc,$i-$VERSION.pom.asc" \
              -Dtypes=jar.asc,jar.asc,jar.asc,pom.asc \
              -Dclassifiers=,sources,javadoc,
            echo "Published $i $VERSION to ${NEXUS_URL}org/liquibase/$i/$VERSION/"
          done
