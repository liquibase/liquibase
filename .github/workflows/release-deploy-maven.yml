name: Release Deploy Maven

run-name: "Deploy to Maven Central - v${{ inputs.version }}${{ inputs.dry_run && ' (Dry Run)' || '' }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run deployment"
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: "The release id of the dry-run release"
        required: false
        type: string
        default: ""
      dry_run_assets_url:
        description: "URL pattern for downloading dry-run release assets"
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run deployment"
        required: false
        type: boolean
        default: false
      dry_run_release_id:
        description: "The release id of the dry-run release"
        required: false
        type: string
        default: ""
      dry_run_assets_url:
        description: "URL pattern for downloading dry-run release assets"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write

env:
  MAVEN_VERSION: "3.9.2"

jobs:
  deploy-maven-production:
    name: Deploy to Maven Central (Production)
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == false }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo liquibase/liquibase --dir "."

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1107: aws-secretsmanager-get-secrets can only load a secret whole, so
        # parse-json-secrets: true put every credential in /vault/liquibase into this
        # job's environment; read only the four keys this job signs and publishes with.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in GPG_SECRET GPG_PASSPHRASE SONATYPE_USERNAME SONATYPE_TOKEN; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: sonatype-nexus-staging
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ env.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ env.SONATYPE_TOKEN }}
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
        run: |
          version=${{ inputs.version }}

          unzip -j liquibase-additional-*.zip

          ##extracts and sign poms, generate checksums for all artifacts
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            unzip -j $i-${version}.jar META-INF/maven/org.liquibase/$i/pom.xml
            sed -i -e "s/<version>\(release\|main\)-SNAPSHOT<\/version>/<version>${version}<\/version>/" pom.xml
            mv pom.xml $i-${version}.pom

            # Sign POM file
            gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab $i-${version}.pom

            # Generate checksums for POM file
            md5sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.md5
            sha1sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha1
            sha256sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha256

            # Sign and checksum every JAR here rather than reusing the sidecars
            # from liquibase-additional-*.zip. Those are produced when artifacts
            # are attached to the draft release, which can be days before the
            # release is published. If the signing key rotates in that window the
            # baked-in .asc files are signed by a key that no longer verifies and
            # Central rejects the whole bundle. Signing at publish time always
            # uses the key currently in the vault.
            #
            # .sha256 also has to be regenerated because the sidecars produced by
            # sign-artifacts.sh carry a trailing space that Sonatype Central
            # Portal rejects as "Invalid sha256 checksum".
            for jar_file in $i-${version}.jar $i-${version}-sources.jar $i-${version}-javadoc.jar; do
              if [ -f "$jar_file" ]; then
                rm -f "$jar_file.asc"
                gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab "$jar_file"
                md5sum "$jar_file" | cut -d' ' -f1 > "$jar_file.md5"
                sha1sum "$jar_file" | cut -d' ' -f1 > "$jar_file.sha1"
                sha256sum "$jar_file" | cut -d' ' -f1 > "$jar_file.sha256"
              fi
            done
          done

          # Create Maven repository layout structure for the bundle
          mkdir -p "bundle/org/liquibase"

          # Copy all artifacts to proper Maven repository layout
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            mkdir -p "bundle/org/liquibase/$i/${version}"
            cp $i-${version}* "bundle/org/liquibase/$i/${version}/"
          done

          # Create the bundle zip file
          cd bundle
          zip -r ../central-bundle.zip .
          cd ..

          # Create base64 encoded credentials for Bearer auth
          AUTH_HEADER=$(printf "%s:%s" "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 -w 0)

          # Upload bundle to Central Portal with AUTOMATIC publishing
          echo "Uploading bundle to Central Portal for liquibase-${version}..."
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${AUTH_HEADER}" \
            -F "bundle=@central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=liquibase-${version}")

          # Parse response
          HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
          DEPLOYMENT_ID=$(echo "$UPLOAD_RESPONSE" | head -n1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Deployment ID: $DEPLOYMENT_ID"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "Upload failed with HTTP status $HTTP_CODE"
            echo "Response: $DEPLOYMENT_ID"
            exit 1
          fi

          echo "Bundle accepted by Central Portal"
          echo "Deployment ID: $DEPLOYMENT_ID"

          # A 201 only means Central accepted the bundle for processing. Validation
          # runs asynchronously afterwards, so poll until it resolves. Without this
          # the job goes green on a release that Central actually rejected.
          echo "Waiting for Central Portal validation of ${DEPLOYMENT_ID}..."
          STATE="UNKNOWN"
          for attempt in $(seq 1 60); do
            STATUS_JSON=$(curl -s -X POST \
              -H "Authorization: Bearer ${AUTH_HEADER}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
            STATE=$(echo "$STATUS_JSON" | jq -r '.deploymentState // "UNKNOWN"')
            echo "  [${attempt}/60] ${STATE}"

            case "$STATE" in
              PUBLISHED)
                echo "liquibase-${version} published to Maven Central"
                exit 0
                ;;
              FAILED)
                echo "Central Portal rejected the deployment:"
                echo "$STATUS_JSON" | jq -r '.errors // .'
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "Timed out after 30m waiting for ${DEPLOYMENT_ID} (last state: ${STATE})"
          echo "Check https://central.sonatype.com/publishing/deployments"
          exit 1

  deploy-maven-dryrun:
    name: Deploy to Maven Central (Dry Run)
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Download dry-run release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh CLI which handles draft release auth correctly
          gh release download "${{ inputs.tag }}" \
            --repo liquibase/liquibase \
            --pattern "*" \
            --dir "."

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1107: aws-secretsmanager-get-secrets can only load a secret whole, so
        # parse-json-secrets: true put every credential in /vault/liquibase into this
        # job's environment; read only the four keys this job signs and publishes with.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in GPG_SECRET GPG_PASSPHRASE SONATYPE_USERNAME SONATYPE_TOKEN; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: dry-run-sonatype-nexus-staging
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      - name: Publish to Central Portal (Dry Run)
        env:
          MAVEN_USERNAME: ${{ env.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ env.SONATYPE_TOKEN }}
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
        run: |
          version=${{ inputs.version }}

          unzip -j liquibase-additional-*.zip

          ##extracts and sign poms, generate checksums for all artifacts
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            unzip -j $i-${version}.jar META-INF/maven/org.liquibase/$i/pom.xml
            sed -i -e "s/<version>\(release\|main\)-SNAPSHOT<\/version>/<version>${version}<\/version>/" pom.xml
            mv pom.xml $i-${version}.pom

            # Sign POM file
            gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab $i-${version}.pom

            # Generate checksums for POM file
            md5sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.md5
            sha1sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha1
            sha256sum $i-${version}.pom | cut -d' ' -f1 > $i-${version}.pom.sha256

            # Sign and checksum every JAR here rather than reusing the sidecars
            # from liquibase-additional-*.zip. Those are produced when artifacts
            # are attached to the draft release, which can be days before the
            # release is published. If the signing key rotates in that window the
            # baked-in .asc files are signed by a key that no longer verifies and
            # Central rejects the whole bundle. Signing at publish time always
            # uses the key currently in the vault.
            #
            # .sha256 also has to be regenerated because the sidecars produced by
            # sign-artifacts.sh carry a trailing space that Sonatype Central
            # Portal rejects as "Invalid sha256 checksum".
            for jar_file in $i-${version}.jar $i-${version}-sources.jar $i-${version}-javadoc.jar; do
              if [ -f "$jar_file" ]; then
                rm -f "$jar_file.asc"
                gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSWORD" -ab "$jar_file"
                md5sum "$jar_file" | cut -d' ' -f1 > "$jar_file.md5"
                sha1sum "$jar_file" | cut -d' ' -f1 > "$jar_file.sha1"
                sha256sum "$jar_file" | cut -d' ' -f1 > "$jar_file.sha256"
              fi
            done
          done

          # Create Maven repository layout structure for the bundle
          mkdir -p "bundle/org/liquibase"

          # Copy all artifacts to proper Maven repository layout
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli'; do
            mkdir -p "bundle/org/liquibase/$i/${version}"
            cp $i-${version}* "bundle/org/liquibase/$i/${version}/"
          done

          # Create the bundle zip file
          cd bundle
          zip -r ../central-bundle.zip .
          cd ..

          # Create base64 encoded credentials for Bearer auth
          AUTH_HEADER=$(printf "%s:%s" "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 -w 0)

          # Upload bundle to Central Portal with USER_MANAGED publishing (dry run)
          echo "Uploading bundle to Central Portal for dry-run liquibase-${version}..."
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${AUTH_HEADER}" \
            -F "bundle=@central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=liquibase-${version}-dry-run")

          # Parse response
          HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
          DEPLOYMENT_ID=$(echo "$UPLOAD_RESPONSE" | head -n1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Deployment ID: $DEPLOYMENT_ID"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "Upload failed with HTTP status $HTTP_CODE"
            echo "Response: $DEPLOYMENT_ID"
            exit 1
          fi

          echo "Bundle accepted by Central Portal for dry-run"
          echo "Deployment ID: $DEPLOYMENT_ID"

          # A 201 only means Central accepted the bundle for processing. Validation
          # runs asynchronously afterwards, so poll until it resolves. Without this
          # the job goes green on a release that Central actually rejected.
          echo "Waiting for Central Portal validation of ${DEPLOYMENT_ID}..."
          STATE="UNKNOWN"
          for attempt in $(seq 1 60); do
            STATUS_JSON=$(curl -s -X POST \
              -H "Authorization: Bearer ${AUTH_HEADER}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
            STATE=$(echo "$STATUS_JSON" | jq -r '.deploymentState // "UNKNOWN"')
            echo "  [${attempt}/60] ${STATE}"

            case "$STATE" in
              VALIDATED|PUBLISHED)
                echo "Dry-run bundle validated. Publishing is USER_MANAGED: review at https://central.sonatype.com/publishing/deployments"
                exit 0
                ;;
              FAILED)
                echo "Central Portal rejected the deployment:"
                echo "$STATUS_JSON" | jq -r '.errors // .'
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "Timed out after 30m waiting for ${DEPLOYMENT_ID} (last state: ${STATE})"
          echo "Check https://central.sonatype.com/publishing/deployments"
          exit 1
