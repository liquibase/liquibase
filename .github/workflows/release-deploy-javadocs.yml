name: Release Deploy Javadocs

run-name: "Deploy Javadocs - ${{ inputs.tag }}${{ inputs.dry_run && ' (Dry Run)' || '' }}"

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run deployment"
        required: false
        type: boolean
        default: false
  
      approved:
        description: "True only when release-published-orchestrator has already cleared the manual-approval gate for this run."
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run deployment"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-javadocs:
    name: Upload Javadocs to R2
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == false }}
    # `approved` is `workflow_call`-only, so a direct dispatch cannot claim it and still meets the
    # reviewers on `release`. An orchestrated run cleared that gate once already.
    # Keep it that way: on `workflow_dispatch` anyone who can dispatch could pick `release-publish`,
    # and a non-`boolean` input would do it silently because the string "false" is truthy.
    environment:
      name: ${{ inputs.approved && 'release-publish' || 'release' }}
    steps:
      - name: Download release javadocs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo liquibase/liquibase --pattern "liquibase-additional*.zip" --dir "."

      - name: Unpack javadoc files
        # unzip archives, create directory for each jar, and extract jar contents to directory.  Then delete the jar and zip files.
        run: |
          unzip -j '*.zip' '*javadoc*.jar'

          for jar in *liquibase*.jar; do
            dir_name=$(basename "$jar" .jar)
            dir_name=$(echo "$dir_name" | sed -E 's/(-[0-9]+(\.[0-9]+)*(-javadoc)?)//')
            mkdir -p "$dir_name"
            unzip -o "$jar" -d "$dir_name"
          done

          rm -rf *.jar *.zip

      # TECHOPS-921: the S3 origin (javadocsliquibasecom-origin) is decommissioned by
      # liquibase-infrastructure#4397, so Cloudflare R2 is now the only publish target.
      # javadocs.liquibase.com has been served from R2 since the TECHOPS-876 cutover;
      # this workflow's S3 write and the vault/build-logic-role steps that fed it only
      # existed to keep Sippy's lazy copy-on-first-read bridge stocked, and TECHOPS-923
      # already tore Sippy down for this bucket.
      #
      # The R2 publish stays continue-on-error, same as before: release-published-orchestrator.yml
      # gates deploy-maven on this job's result, so a hard failure here would skip the
      # Maven Central deployment for the whole release. A broken R2 leg degrades to a
      # warning and no published javadocs, never a failed release.
      - name: Configure AWS credentials for devops vault access
        id: r2-auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEVOPS_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load Cloudflare R2 credentials from devops vault
        id: r2-creds
        continue-on-error: true
        if: steps.r2-auth.outcome == 'success'
        # The R2 keys live in /vault/devops. Pull ONLY these three and mask them
        # rather than bulk-importing the vault. The runner unescapes %0D, %0A and
        # %25 in command data, so a value carrying those literals would register a
        # mask that never matches it; hence the same escaping below.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/devops --region us-east-1 --query SecretString --output text)
          for k in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/devops"; exit 1; fi
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      - name: Publish javadocs to Cloudflare R2
        # TECHOPS-1318: the id is what makes the warn step below able to see a
        # failed sync. continue-on-error rewrites this step's *conclusion* to
        # success while leaving its *outcome* as failure, so without an id there
        # is no way to read the real result and a broken sync goes green.
        id: r2-publish
        continue-on-error: true
        if: steps.r2-creds.outcome == 'success'
        env:
          R2_AKID: ${{ env.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ env.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          if [ -z "${R2_AKID:-}" ] || [ -z "${R2_SECRET:-}" ] || [ "$R2_ENDPOINT" = "https://.r2.cloudflarestorage.com" ]; then
            echo "::warning::R2 credentials unavailable; javadocs were NOT published this release."
            exit 1
          fi
          # env -u drops the assumed-role session token: R2 does not recognise it and
          # SigV4 fails when it is present. --checksum-algorithm CRC32 because the
          # newer AWS CLI default checksum trailer is not supported by R2.
          env -u AWS_SESSION_TOKEN \
            AWS_ACCESS_KEY_ID="$R2_AKID" AWS_SECRET_ACCESS_KEY="$R2_SECRET" \
            aws s3 sync . "s3://javadocs-liquibase-com" \
              --endpoint-url "$R2_ENDPOINT" \
              --checksum-algorithm CRC32 \
              --only-show-errors

      - name: Warn if the R2 publish did not run
        # Checks the publish outcome, not just the credential steps. A failed
        # `aws s3 sync` (wrong bucket, SigV4 rejection, R2 5xx, token scope)
        # leaves r2-auth and r2-creds both successful, so the first two clauses
        # alone would stay false and the job would report green having published
        # nothing. A skipped publish also has a non-success outcome, so the third
        # clause subsumes the other two; they are kept for legibility about what
        # can go wrong.
        if: steps.r2-creds.outcome != 'success' || steps.r2-auth.outcome != 'success' || steps.r2-publish.outcome != 'success'
        run: echo "::warning::javadocs were NOT published to Cloudflare R2. javadocs.liquibase.com will serve the previous release until this is re-run."
