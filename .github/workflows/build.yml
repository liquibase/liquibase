
name: Build and Publish

# Security: Minimal permissions for build workflow
# - contents: read - checkout code (write not needed for builds)
# - packages: write - publish snapshots to GitHub Packages
# - actions: read - read workflow artifacts
# - id-token: write - AWS OIDC authentication
permissions:
  contents: read
  packages: write
  actions: read
  id-token: write

# The concurrency check will cancel in-progress runs on non-main branches and pull requests on forked repositories regardless of the target branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref == 'main' && 'main' || github.run_id }}
  cancel-in-progress: true

on:
  workflow_call:
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    # Fail closed: this job checks out a PR head ref, so it must never run
    # against a fork ref, whatever PR event the caller was triggered by.
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticate GitHub Actions to the GitHub API.
      github-token: ${{ secrets.GITHUB_TOKEN }} # accessing a private repository
    outputs:
      thisBranchName: ${{ steps.get-branch-name.outputs.thisBranchName }}
      latestMergeSha: ${{ steps.get-sha.outputs.latestMergeSha }}
      timeStamp: ${{ steps.get-timestamp.outputs.timestamp }}
      unmodifiedBranchName: ${{ steps.get-branch-name.outputs.unmodifiedBranchName }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after}}
      - name: Get Latest Merge Commit SHA
        id: get-sha
        run: |
          latest_merge_sha=`(git rev-parse HEAD)`
          echo "latestMergeSha=${latest_merge_sha}" >> $GITHUB_OUTPUT

      - name: Get Timestamp
        id: get-timestamp
        run: |
          timeStamp=$(date +'%Y-%m-%d %H:%M:%S %Z')
          echo "timestamp=${timeStamp}" >> $GITHUB_OUTPUT

      - name: Get Current BranchName
        id: get-branch-name
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # this logic checks if the branch is from a forked repository PR or not. Where -n is the inverse of -z (not empty)
          if [ -n "${GITHUB_HEAD_REF}" ];
          then
            branch_name=${GITHUB_HEAD_REF}
          else
            branch_name=$REF_NAME
          fi
          modified_branch_name=$(echo $branch_name | tr '/' '_')
          echo "thisBranchName=$modified_branch_name" >> $GITHUB_OUTPUT
          echo "unmodifiedBranchName=$branch_name" >> $GITHUB_OUTPUT
          echo "Modified Branch Name:" $modified_branch_name
          echo "Original Branch Name thisBranchName:" $branch_name

  build_publish_branch:
    name: Artifacts - Build & Package
    # Fail closed: this job loads the full vault and checks out a PR head ref, so
    # it must never run against a fork ref, whatever PR event the caller was
    # triggered by and even if the upstream authorize gate is changed or removed.
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after}}
      # this includes all the tar files included in the previous runs. So in the next step we deploy what was previously build
      - name: Download Artifacts for build.yml
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: temp-artifact

      ##Cache based on install4j file, since changes to JVM is seen in there. If install4j version changes without changing the file, change the prefix letter before hashFiles to force a new cache
      - name: Install4j Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: install4j-A${{ hashFiles('liquibase-dist/src/main/install4j/liquibase.install4j') }}
          path: ~/.install4j8/**

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        # TECHOPS-1188: aws-secretsmanager-get-secrets can only load a secret whole, so
        # parse-json-secrets: true put every credential in /vault/liquibase into this
        # job's environment; read only the four keys this job uses instead.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in GPG_SECRET GPG_PASSPHRASE LIQUIBOT_PAT_GPM_ACCESS INSTALL4J_LICENSE; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            # Escaped, one command masks the whole value and every line within it.
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON
          echo "Loaded GPG_SECRET, GPG_PASSPHRASE, LIQUIBOT_PAT_GPM_ACCESS and INSTALL4J_LICENSE from /vault/liquibase."

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
          cache: "maven"
          overwrite-settings: false
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      #look for dependencies in maven
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp .github/maven/settings-snapshots.xml ~/.m2/settings.xml
          echo "MAVEN_GPM_PASSWORD=${{ env.LIQUIBOT_PAT_GPM_ACCESS }}" >> $GITHUB_ENV

      # Version artifact based off of branch
      - name: Version Artifact
        env:
          BRANCH_NAME: ${{ needs.setup.outputs.thisBranchName }}
        run: |
          version=$BRANCH_NAME-SNAPSHOT
          ./mvnw versions:set -DnewVersion="$version"

      - name: Artifacts - Build & Sign
        env:
          INSTALL4J_LICENSE: ${{ env.INSTALL4J_LICENSE }}
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ needs.setup.outputs.thisBranchName }}
          MERGE_SHA: ${{ needs.setup.outputs.latestMergeSha }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.timeStamp }}
        run: |
          ## save install4j code signing keys
          mkdir -p liquibase-dist/target/keys

          # keep temp-artifact's 0-SNAPSHOT jars, the build below cleans these modules
          mkdir -p prebuilt
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli' 'liquibase-extension-testing'; do
            cp $i/target/$i-0-SNAPSHOT*.jar prebuilt/
          done

          ./mvnw -B -pl liquibase-dist,liquibase-maven-plugin,liquibase-extension-testing -am source:jar clean package failsafe:integration-test failsafe:verify \
          "-Dbuild.repository.owner=liquibase" \
          "-Dbuild.repository.name=liquibase" \
          "-Dbuild.branch=$BRANCH_NAME" \
          "-Dbuild.number=${{ github.run_number }}" \
          "-Dbuild.commit=$MERGE_SHA" \
          "-Dbuild.timestamp=$BUILD_TIMESTAMP"

          # Extract the tarball to allow us to upload the liquibase installation files to our
          # github actions workflow so that we don't double zip the archive
          mkdir -p branch-artifacts
          tar -xzf liquibase-dist/target/liquibase-$BRANCH_NAME-SNAPSHOT.tar.gz -C branch-artifacts

          ##create installer - disabled here but run as nightly job and as part of release workflow
          # (cd liquibase-dist && ${{ github.workspace }}/.github/util/package-install4j.sh 0-SNAPSHOT)

          # Remove original JARs
          find . -name original-*.jar -exec rm {} \;

          # Copy artifacts
          mkdir -p artifacts

          cp liquibase-dist/target/liquibase-$BRANCH_NAME-SNAPSHOT.tar.gz artifacts
          cp liquibase-dist/target/liquibase-$BRANCH_NAME-SNAPSHOT.zip artifacts
          cp liquibase-core/target/liquibase-core-$BRANCH_NAME-SNAPSHOT.jar artifacts/liquibase-core-0-SNAPSHOT.jar
          #cp liquibase-dist/target/liquibase-$BRANCH_NAME-SNAPSHOT/internal/lib/liquibase-core.jar artifacts/liquibase-core-0-SNAPSHOT.jar

          cp liquibase-core/target/liquibase-core-$BRANCH_NAME-SNAPSHOT-sources.jar artifacts/liquibase-core-0-SNAPSHOT-sources.jar
          cp target/liquibase-$BRANCH_NAME-SNAPSHOT-javadoc.jar artifacts/liquibase-core-0-SNAPSHOT-javadoc.jar

          ##create installer - disabled here but run as nightly job and as part of release workflow
          #cp liquibase-dist/target/liquibase-*-installer-* artifacts

          for i in 'liquibase-maven-plugin' 'liquibase-cli'; do
            cp prebuilt/$i-0-SNAPSHOT.jar artifacts/$i-0-SNAPSHOT.jar
            cp prebuilt/$i-0-SNAPSHOT-sources.jar artifacts/$i-0-SNAPSHOT-sources.jar
            cp prebuilt/$i-0-SNAPSHOT-javadoc.jar artifacts/$i-0-SNAPSHOT-javadoc.jar
          done

          .github/util/sign-artifacts.sh artifacts

          ##prepare branch-named convenience artifacts directories
          mkdir artifacts-named

          cp liquibase-dist/target/liquibase-$BRANCH_NAME-SNAPSHOT.tar.gz artifacts-named/liquibase-$BRANCH_NAME.tar.gz

          # liquibase-sdk:install-snapshot runs install-file over these without coordinates, so maven
          # reads the embedded pom: they need 0-SNAPSHOT inside even though the file name says the branch
          cp prebuilt/liquibase-extension-testing-0-SNAPSHOT-deps.jar artifacts-named/liquibase-extension-testing-$BRANCH_NAME-deps.jar
          for i in 'liquibase-core' 'liquibase-maven-plugin' 'liquibase-cli' 'liquibase-extension-testing'; do
            cp prebuilt/$i-0-SNAPSHOT.jar artifacts-named/$i-$BRANCH_NAME.jar
          done

      - name: Archive Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-artifacts
          path: artifacts/*

      - name: Archive Convenience Zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-zip-${{ needs.setup.outputs.thisBranchName }}
          path: branch-artifacts/*

      - name: Archive Convenience Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-artifacts-${{ needs.setup.outputs.thisBranchName }}
          path: artifacts-named/*

      # Publish <commitsha>-SNAPSHOT version to GPM
      - name: Version Artifact Publish <commitsha>-SNAPSHOT version to GPM
        env:
          MERGE_SHA: ${{ needs.setup.outputs.latestMergeSha }}
        run: |
          ./mvnw versions:set "-DnewVersion=$MERGE_SHA-SNAPSHOT"
      - name: Publish <commitsha>-SNAPSHOT package
        run: |
          ./mvnw -B clean deploy -pl '!liquibase-dist' -DskipTests=true "-Dbuild.repository.owner=liquibase" "-Dbuild.repository.name=liquibase" "-Dbuild.branch=$BRANCH_NAME" "-Dbuild.number=${{ github.run_number }}" "-Dbuild.commit=$MERGE_SHA" "-Dbuild.timestamp=$BUILD_TIMESTAMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ needs.setup.outputs.thisBranchName }}
          MERGE_SHA: ${{ needs.setup.outputs.latestMergeSha }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.timeStamp }}

      #Publish to GitHub Packages.
      - name: Publish tar.gz package to GPM
        run: |
          ./mvnw -B -pl liquibase-dist clean deploy -DskipTests=true "-Dbuild.timestamp=$BUILD_TIMESTAMP" "-Dbuild.repository.owner=liquibase" "-Dbuild.repository.name=liquibase" "-Dbuild.branch=$BRANCH_NAME" "-Dbuild.number=${{ github.run_number }}" "-Dbuild.commit=$MERGE_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ needs.setup.outputs.thisBranchName }}
          MERGE_SHA: ${{ needs.setup.outputs.latestMergeSha }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.timeStamp }}

  run-tests-harness:
    needs: [setup, build_publish_branch]
    uses: liquibase/liquibase/.github/workflows/run-test-harness.yml@main
    secrets: inherit
    with:
      latestMergeSha: ${{ needs.setup.outputs.latestMergeSha }}
      thisBranchName: ${{ needs.setup.outputs.unmodifiedBranchName }}
