# DISABLED 2026-08-25 (TECHOPS-1112): superseded by CodeQL, Trivy scans and Dependabot; last run 2025-10. Do not re-enable; the file is kept for history until the post-Phase-3 deletion PR.
name: OWASP Dependency Scanner

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to scan'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read
  packages: read
  id-token: write
  actions: read

jobs:
  owasp-scan:
    name: OWASP Dependency Check
    uses: liquibase/build-logic/.github/workflows/owasp-scanner.yml@main
    with:
      repository: 'liquibase'
      branch: ${{ github.event.inputs.branch }}
    secrets: inherit
