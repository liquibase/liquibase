name: Docker

# Trusted-context Docker test + scan for the community images. The build-logic
# reusables load vault credentials (Pro license for tests, GHCR push + Slack for
# scans), so this runs on push to main, nightly and dispatch only. PRs get the
# secret-free `docker-smoke` job in pr.yml. Replaces docker-test.yml and
# docker-scan.yml. [TECHOPS-1104]

on:
  push:
    branches: [ main ]
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  test:
    name: Test ${{ matrix.variant }} on ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        variant: [ community, alpine ]
        runs_on: [ ubuntu-latest, macos-15-intel ]
        include:
          - variant: community
            dockerfile: docker/Dockerfile
          - variant: alpine
            dockerfile: docker/Dockerfile.alpine
    uses: liquibase/build-logic/.github/workflows/reusable-docker-test.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      build_context: docker/
      dockerfile_path: ${{ matrix.dockerfile }}
      runs_on: ${{ matrix.runs_on }}
    secrets: inherit

  scan:
    name: Scan ${{ matrix.variant }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: community
            dockerfile: docker/Dockerfile
            suffix: ""
          - variant: alpine
            dockerfile: docker/Dockerfile.alpine
            suffix: "-alpine"
    uses: liquibase/build-logic/.github/workflows/reusable-docker-scan.yml@main
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
      pull-requests: write # declared by the reusable; no-op on push
      actions: read
    with:
      build_context: docker/
      dockerfile_path: ${{ matrix.dockerfile }}
      image_name: liquibase/liquibase
      suffix: ${{ matrix.suffix }}
      vex_enabled: false
      upload_sarif: true
      dispatch_new_cves: false
    secrets: inherit

  # Publishes the community-image scan of main HEAD to the scan-results branch
  # under liquibase/liquibase/latest/ for the internal security portal.
  # Not gated on scan success: "Check scan results" in the reusable is a
  # threshold verdict and the report artifact is uploaded before it runs.
  # Shares the scan-results-writer group with trivy-scan-published-images.yml
  # so the two never race. [TECHOPS-408]
  persist-main-latest:
    name: Persist main HEAD scan to scan-results
    needs: scan
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: scan-results-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # persist-scan-results.sh pushes to the scan-results branch with the
          # checkout token; this is the one checkout that needs it.
          persist-credentials: true

      - name: Download community scan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: scan-artifacts
          pattern: vulnerability-report-liquibase-liquibase-latest

      # download-artifact@v8 flattens a single-match download into `path`;
      # persist-scan-results.sh expects scan-artifacts/<artifact-name>/.
      - name: Wrap artifact files in expected subdir
        run: |
          set -euo pipefail
          ART_DIR="scan-artifacts/vulnerability-report-liquibase-liquibase-latest"
          if [ ! -d "$ART_DIR" ]; then
            mkdir -p "$ART_DIR"
            find scan-artifacts -maxdepth 1 -type f -exec mv -t "$ART_DIR/" {} +
          fi

      - name: Checkout build-logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liquibase/build-logic
          ref: main
          path: build-logic
          persist-credentials: false

      - name: Persist to scan-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash build-logic/scripts/vulnerability-scanning/persist-scan-results.sh scan-artifacts
