name: Attach Artifacts To Draft Release

# Deny by default; the two jobs that need scopes grant them for themselves below.
permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (example: 4.8.2)"
        required: true
      branch:
        description: "Branch to release (Defaults to main)"
        required: false
        default: "main"
      standalone_zip:
        description: "Flag to indicate if the workflow is triggered to create a standalone zip"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Flag to indicate if the workflow is triggered to create a dry-run release"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version (example: 4.8.2)"
        required: true
        type: string
      branch:
        description: "Branch to release (Defaults to main)"
        required: false
        default: "main"
        type: string
      standalone_zip:
        description: "Flag to indicate if the workflow is triggered to create a standalone zip"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Flag to indicate if the workflow is triggered to create a dry-run release"
        required: true
        type: boolean
        default: false
    outputs:
      dry_run_zip_url:
        description: "The URL of the created zip file"
        value: ${{ jobs.build-installers.outputs.dry_run_zip_url }}
      dry_run_tar_gz_url:
        description: "The URL of the created tar.gz file"
        value: ${{ jobs.build-installers.outputs.dry_run_tar_gz_url }}

jobs:
  # [TECHOPS-1223] Trust flows commit -> build -> tag, never tag -> artifact. This job is
  # the resolution and admission gate: it turns `inputs.branch` into an immutable 40-hex
  # SHA, validates `inputs.version`, and rejects a pre-existing tag before any build minute
  # is spent. Every downstream job checks out this SHA; none of them re-resolves a ref.
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    permissions:
      contents: read              # workflow-level is `permissions: {}`; gh api needs this
    outputs:
      version: ${{ inputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      build_timestamp: ${{ steps.resolve.outputs.build_timestamp }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Injection sink: REF/VERSION are dispatch inputs. Passed via env, never
          # interpolated into the script body, and VERSION is charset-validated
          # because it becomes a git ref and a filename below.
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad version"; exit 1; }
          # The charset alone still admits refs git rejects, `1..0` and names ending in
          # `.lock` among them. The tag is not created until the end of the run, so without
          # this the pipeline would build and sign before discovering the name is unusable.
          git check-ref-format "refs/tags/v$VERSION" || {
            echo "::error::v$VERSION is not a valid tag name"; exit 1; }

          sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$REF did not resolve"; exit 1; }
          if gh api "repos/$REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

          # Nothing else asserts the commit is releasable, and the build runs -DskipTests,
          # so without this a red commit ships. A commit with no completed checks is refused
          # as well: "never tested" and "tested green" must not look the same here.
          runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs')
          bad=$(jq -r '[.[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled") | .name] | join(", ")' <<<"$runs")
          ok=$(jq -r '[.[] | select(.conclusion=="success")] | length' <<<"$runs")
          [ -z "$bad" ] || { echo "::error::$sha has failing checks: $bad"; exit 1; }
          [ "$ok" -gt 0 ] || { echo "::error::$sha has no successful check runs"; exit 1; }
          echo "$sha: $ok successful checks, none failing"

          # Taken from the commit rather than the clock, so re-running the same tag yields
          # the same value. Byte-for-byte reproducibility additionally needs
          # project.build.outputTimestamp in the poms, which is a separate change.
          committed=$(gh api "repos/$REPO/commits/$sha" --jq .commit.committer.date)
          echo "build_timestamp=$(date -u -d "$committed" +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  reversion:
    needs: [setup]
    name: Re-version artifacts ${{ needs.setup.outputs.version }}
    runs-on: ubuntu-22.04
    # [TECHOPS-1223] Same expression release-deploy-maven.yml uses, but keyed on dry_run
    # instead of approved: this job is reached directly through workflow_dispatch (via
    # dispatch-and-wait), never through this repo's own workflow_call chain, so dry_run
    # is the input that actually distinguishes a rehearsal from a real release here.
    # `release-publish` has 0 reviewers so the weekly cron is not blocked; `release` has
    # 5. See .github/workflows/README.md for the broad-role OIDC trust this depends on.
    environment:
      # `release-publish` has 0 reviewers, which the weekly rehearsal needs so the cron
      # does not hang. It is reachable only for a dry run of `main`: `branch` is a free-form
      # dispatch input and this job builds it with Maven, so any other ref executing
      # third-party plugins beside the GPG key goes through `release` and its 5 reviewers.
      name: ${{ (inputs.dry_run && inputs.branch == 'main') && 'release-publish' || 'release' }}
    permissions:
      # contents: read for checkout; packages: read for the GitHub Packages Maven repo
      # (mirrors ci-test.yml); id-token: AWS OIDC for vault.
      contents: read
      packages: read
      id-token: write
    steps:
      # No git credential is persisted here: the tag is created through the API, below,
      # with a token minted after the build finishes. [TECHOPS-1223]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: liquibase

      - name: Build release distribution
        # Fully-qualified goal, not the `versions:set` prefix: resolving a plugin prefix
        # makes Maven fetch org/codehaus/mojo/maven-metadata.xml from Central on every run,
        # and a 429 there fails the build outright. [TECHOPS-1222]
        #
        # -pl is liquibase-dist,liquibase-maven-plugin -am: liquibase-extension-testing is
        # dropped because its artifacts are never a release asset, and source:jar is dropped
        # because maven-source-plugin is already bound to package for these modules and
        # `clean` would delete a standalone source:jar output anyway.
        env:
          GITHUB_TOKEN: ${{ github.token }}        # setup-java server-id credential
          VERSION: ${{ needs.setup.outputs.version }}
          SHA: ${{ needs.setup.outputs.sha }}
          REF: ${{ inputs.branch }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_TS: ${{ needs.setup.outputs.build_timestamp }}
        run: |
          set -euo pipefail
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion="$VERSION"
          ./mvnw -B -DskipTests \
            -Dbuild.repository.owner=liquibase -Dbuild.repository.name=liquibase \
            -Dbuild.branch="$REF" -Dbuild.number="$RUN_NUMBER" \
            -Dbuild.commit="$SHA" -Dbuild.version="$VERSION" \
            "-Dbuild.timestamp=$BUILD_TS" \
            -pl liquibase-dist,liquibase-maven-plugin -am clean package

      - name: Stage release artifacts
        # No credential is involved in staging, so it runs immediately after the build
        # rather than being interleaved with the vault reads below. re-version/final holds
        # the three primary release assets; artifacts-additional holds everything that
        # ships inside the additional zip, signed in the next step.
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p re-version/final artifacts-additional

          cp liquibase-dist/target/liquibase-$VERSION.tar.gz re-version/final/
          cp liquibase-dist/target/liquibase-$VERSION.zip re-version/final/
          cp liquibase-core/target/liquibase-core-$VERSION.jar re-version/final/

          cp liquibase-core/target/liquibase-core-$VERSION-sources.jar artifacts-additional/
          cp target/liquibase-$VERSION-javadoc.jar artifacts-additional/liquibase-core-$VERSION-javadoc.jar
          cp liquibase-maven-plugin/target/liquibase-maven-plugin-$VERSION.jar artifacts-additional/
          cp liquibase-maven-plugin/target/liquibase-maven-plugin-$VERSION-sources.jar artifacts-additional/
          cp liquibase-maven-plugin/target/liquibase-maven-plugin-$VERSION-javadoc.jar artifacts-additional/
          cp liquibase-cli/target/liquibase-cli-$VERSION.jar artifacts-additional/
          cp liquibase-cli/target/liquibase-cli-$VERSION-sources.jar artifacts-additional/
          cp liquibase-cli/target/liquibase-cli-$VERSION-javadoc.jar artifacts-additional/

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1107: aws-secretsmanager-get-secrets can only load a secret whole, so
        # parse-json-secrets: true put every credential in /vault/liquibase into this
        # job's environment; read only the two GPG keys this step signs with.
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in GPG_SECRET GPG_PASSPHRASE; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up JDK for GPG
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: "temurin"
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      - name: Sign additional artifacts
        # Runs from the checked-out tree: sign-artifacts.sh is a tracked file at the pinned
        # SHA, not a script fetched over the network. [TECHOPS-1223]
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/util/sign-artifacts.sh artifacts-additional
          (cd artifacts-additional && zip -q ../re-version/final/liquibase-additional-$VERSION.zip *)

      - name: Upload Completed Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completed-artifacts-${{ github.run_number }}-${{ github.run_attempt }}
          path: re-version/final
          retention-days: 1

  build-installers:
    needs: [setup, reversion]
    name: Build Installers
    runs-on: ubuntu-22.04
    # [TECHOPS-1223] See the comment on `reversion`, above.
    environment:
      # `release-publish` has 0 reviewers, which the weekly rehearsal needs so the cron
      # does not hang. It is reachable only for a dry run of `main`: `branch` is a free-form
      # dispatch input and this job builds it with Maven, so any other ref executing
      # third-party plugins beside the GPG key goes through `release` and its 5 reviewers.
      name: ${{ (inputs.dry_run && inputs.branch == 'main') && 'release-publish' || 'release' }}
    permissions:
      # contents: attach assets to the draft release; id-token: AWS OIDC for vault.
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}
          # This job runs no networked git command, so the token does not need to sit in .git/config.
          persist-credentials: false

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1107: aws-secretsmanager-get-secrets can only load a secret whole, so
        # parse-json-secrets: true put every credential in /vault/liquibase into this
        # job's environment; read only what this job signs and builds with. Replaces the
        # TECHOPS-1048 workaround that loaded the KeyLocker keys and blanked them again
        # on dry runs: a dry run never reaches the signing steps, so it never loads them.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          KEYS="GPG_SECRET GPG_PASSPHRASE INSTALL4J_LICENSE_KEY"
          if [ "$DRY_RUN" != "true" ]; then
            # The DigiCert KeyLocker client tools and jsign read SM_* straight from the
            # environment rather than through named inputs, so load that whole family by
            # prefix; naming them individually would silently drop any key added later.
            KEYS="$KEYS $(printf '%s' "$JSON" | jq -r 'keys[] | select(startswith("SM_"))' | tr '\n' ' ')"
          fi
          for k in $KEYS; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Download Completed Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: completed-artifacts-${{ github.run_number }}-${{ github.run_attempt }}
          path: re-version/final

       # https://github.com/actions/setup-java/tree/v4/?tab=readme-ov-file#install-multiple-jdks
      - name: Set up JDK for GPG
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: |
            17
            8
          distribution: "temurin"
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      - name: Decode Client Authentication Certificate
        if: ${{ inputs.dry_run == false }}
        run: |
          # Read the secret from the shell environment rather than expanding
          # ${{ env.SM_CLIENT_CERT_FILE_B64 }} into the generated script (zizmor
          # template-injection). "Get secrets from vault" above already exports it
          # into the job env via parse-json-secrets, so the value is identical.
          printf '%s' "$SM_CLIENT_CERT_FILE_B64" | base64 --decode > /tmp/client-auth.p12

      - name: Set Environment Variables for Signing
        if: ${{ inputs.dry_run == false }}
        run: |
          # SM_HOST, SM_API_KEY, SM_CLIENT_CERT_PASSWORD, SM_CODE_SIGNING_CERT_SHA1_HASH
          # and SM_KEY_PAIR_ALIAS are already in the job environment — "Get secrets from
          # vault" exports every field of /vault/liquibase via parse-json-secrets. Copying
          # them onto themselves through ${{ env.X }} only re-expanded five more secrets
          # into a generated shell script (TECHOPS-1048). SM_CLIENT_CERT_FILE is the one
          # value the vault can't supply: it points at the cert decoded in the step above.
          echo "SM_CLIENT_CERT_FILE=/tmp/client-auth.p12" >> "$GITHUB_ENV"

      - name: Install jsign and osslsigncode
        if: ${{ inputs.dry_run == false }}
        run: |
          curl -fSslL https://github.com/ebourg/jsign/releases/download/3.1/jsign_3.1_all.deb -o jsign_3.1_all.deb
          sudo dpkg --install jsign_3.1_all.deb
          sudo apt-get install osslsigncode

      - name: Create pkcs11properties.cfg
        if: ${{ inputs.dry_run == false }}
        run: |
          cat << EOF > pkcs11properties.cfg
          name=signingmanager
          library="$(pwd)/.github/util/smpkcs11.so"
          slotListIndex=0
          EOF
          mv pkcs11properties.cfg $(pwd)/.github/util/

      - name: Install Android SDK & Build Tools
        run: |
          export JAVA_HOME=${JAVA_HOME_17_x64}
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip tools.zip -d temp
          rm tools.zip
          mv temp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "build-tools;30.0.2"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/30.0.2" >> $GITHUB_PATH

      - name: Install DigiCert KeyLocker Client Tools
        if: ${{ inputs.dry_run == false }}
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1

      - name: Build Unsigned Windows Installer
        env:
          INSTALL4J_LICENSE_KEY: ${{ env.INSTALL4J_LICENSE_KEY }}
        run: |
          version="${{ needs.setup.outputs.version }}"
          tarFile=$(pwd)/re-version/final/liquibase-$version.tar.gz
          scriptDir=$(pwd)/.github/util/

          mkdir -p liquibase-dist/target/liquibase-$version
          (cd liquibase-dist/target/liquibase-$version && tar xfz $tarFile)
          (cd liquibase-dist && $scriptDir/package-install4j.sh $version)
          mv liquibase-dist/target/liquibase-*-installer-* re-version/final

      - name: Find Unsigned Windows Installer
        id: find-installer
        run: |
          INSTALLER_PATH=$(find re-version/final -name "liquibase-*-installer-*" | head -n 1)
          if [ -z "$INSTALLER_PATH" ]; then
            echo "Error: No installer file found!"
            exit 1
          fi
          echo "Found installer: $INSTALLER_PATH"
          echo "INSTALLER_PATH=$INSTALLER_PATH" >> $GITHUB_ENV

      - name: Sign Windows Installer using KeyLocker
        if: ${{ inputs.dry_run == false }}
        run: |
          smctl sign -v --fingerprint "$SM_CODE_SIGNING_CERT_SHA1_HASH" \
          --keypair-alias $SM_KEY_PAIR_ALIAS \
          --certificate "$SM_CLIENT_CERT_FILE" \
          --config-file "$(pwd)/.github/util/pkcs11properties.cfg" \
          --input "$INSTALLER_PATH" --tool jsign

      - name: Verify Windows Installer Signature
        if: ${{ inputs.dry_run == false }}
        run: osslsigncode verify -CAfile /etc/ssl/certs/ca-certificates.crt -in "$INSTALLER_PATH"

      - name: Re-version Installers
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
        run: |
          version="${{ needs.setup.outputs.version }}"

          ##Sign Files
          bash .github/util/sign-artifacts.sh re-version/final

          (cd re-version/final && zip liquibase-additional-$version.zip *.asc *.md5 *.sha1 *.sha256)
          rm re-version/final/*.asc
          rm re-version/final/*.md5
          rm re-version/final/*.sha1
          rm re-version/final/*.sha256

      - name: Attach Files to Draft Release
        if: ${{ inputs.standalone_zip == false && inputs.dry_run == false }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          # `draft: true` creates no git ref, so the tag is not made here. The commitish
          # still decides which base `generate_release_notes` diffs against, which without
          # it is the default branch rather than the commit these assets were built from.
          target_commitish: ${{ needs.setup.outputs.sha }}
          fail_on_unmatched_files: true
          body: Liquibase ${{ needs.setup.outputs.version }}
          generate_release_notes: true
          draft: true
          files: re-version/final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Files to Dry-Run Draft Release
        id: attach-files-dry-run
        if: ${{ inputs.standalone_zip == false && inputs.dry_run == true }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          # `draft: true` creates no git ref, so the tag is not made here. The commitish
          # still decides which base `generate_release_notes` diffs against, which without
          # it is the default branch rather than the commit these assets were built from.
          target_commitish: ${{ needs.setup.outputs.sha }}
          fail_on_unmatched_files: true
          body: Liquibase ${{ needs.setup.outputs.version }} (Dry-Run)
          generate_release_notes: true
          draft: true
          files: re-version/final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach standalone zip to Build
        if: ${{ inputs.standalone_zip == true && inputs.dry_run == false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-installers-${{ needs.setup.outputs.version }}
          path: re-version/final/*

  tag-release:
    name: Create release tag
    needs: [setup, reversion, build-installers]
    # The tag is the last thing a release does. Creating it inside `reversion`, before the
    # installers existed, left `v$VERSION` pointing at a commit with no release whenever
    # `build-installers` failed, and because the API call is deliberately non-forcing the
    # retry then died on setup's pre-existing-tag check instead of recovering the way
    # `git push -f` used to. Nothing is tagged now until every asset is built. [TECHOPS-1223]
    if: ${{ inputs.standalone_zip == false && inputs.dry_run == false }}
    runs-on: ubuntu-22.04
    # `release` already gated `reversion` for this run, so asking again would be a second
    # prompt for one release. `release-publish` is the codified "approved upstream" variant,
    # unreachable on its own here: this job needs three jobs that cannot run without it.
    environment:
      name: release-publish
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get App credentials from vault
        id: app-vault
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in LIQUIBASE_GITHUB_APP_ID LIQUIBASE_GITHUB_APP_PRIVATE_KEY; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            # Step outputs, not GITHUB_ENV: only the token step needs these, and GITHUB_ENV
            # would hand them to every later step in the job.
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_OUTPUT"
          done
          unset JSON

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ steps.app-vault.outputs.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ steps.app-vault.outputs.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Without `repositories` the token would cover every repo in the org, since the
          # app is installed on all of them.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write        # only scope; no permission-actions

      - name: Create release tag
        # Atomic and non-forcing: POST /git/refs has no `force` parameter, so it 422s on a
        # pre-existing ref instead of silently repointing an already-released tag. A re-run
        # against the same version therefore fails fast here rather than repointing history.
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$SHA"

      - name: Verify the tag points at the built commit
        # No dry run reaches this job, so a real release is the first execution of every
        # step above. Reading the tag back turns a silent mistake into a failed release.
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          got=$(gh api "repos/$REPO/git/ref/tags/v$VERSION" --jq .object.sha)
          [ "$got" = "$SHA" ] || {
            echo "::error::tag v$VERSION points at $got, expected $SHA"; exit 1; }
          echo "v$VERSION -> $SHA"
