name: Build Test Installers

on:
  workflow_dispatch:
  push:
    branches:
      - gha-scheduled-*

permissions:
  id-token: write # Required for OIDC authentication with AWS
  actions: read # Required for cross-workflow artifact download

jobs:
  build-installers:
    name: Build Installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      # TECHOPS-1048: this workflow checks that the installer *builds*; the KeyLocker
      # signing steps were removed from it, so it now needs GPG only. /vault/liquibase is
      # one shared secret the action can only load whole, so blank the signing credentials
      # rather than leave them in the environment of a workflow that never signs.
      - name: Drop unused KeyLocker credentials from the job environment
        run: |
          for name in ${!SM_@}; do
            echo "$name=" >> "$GITHUB_ENV"
            echo "Cleared $name"
          done

      - name: Convert escaped newlines and set GPG key
        run: |
          GPG_KEY_CONTENT="$(printf '%b' "${{ env.GPG_SECRET }}")"
          {
            echo "GPG_KEY_CONTENT<<GPG_EOF"
            echo "$GPG_KEY_CONTENT"
            echo
            echo "GPG_EOF"
          } >> $GITHUB_ENV
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//%/%25}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\r'/%0D}"
          GPG_KEY_CONTENT="${GPG_KEY_CONTENT//$'\n'/%0A}"
          echo "::add-mask::${GPG_KEY_CONTENT}"

      - name: Set up JDK for GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "17"
          distribution: "temurin"
          gpg-private-key: ${{ env.GPG_KEY_CONTENT }}
          gpg-passphrase: GPG_PASSPHRASE
          overwrite-settings: false
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}

      # TODO: Add install4j caching if possible
      # - name: Cache Install4j
      #   id: cache-install4j
      #   uses: actions/cache@v4
      #   with:
      #     path: /usr/local/bin/install4jc
      #     key: install4j-${{ runner.os }}-10_0_9

      # - name: Install Install4j (if not cached)
      #   if: steps.cache-install4j.outputs.cache-hit != 'true'
      #   run: |
      #     wget -nv -O install4j.deb "https://download.ej-technologies.com/install4j/install4j_linux-x64_10_0_9.deb"
      #     sudo apt install -y ./install4j.deb
      #     rm install4j.deb

      - name: Set branch variable
        run: echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Get latest successful run-tests run ID
        id: get-run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/run-tests.yml/runs?branch=${{ env.BRANCH }}&status=success&per_page=1" --jq '.workflow_runs[0].id')
          if [ -z "$run_id" ] || [ "$run_id" == "null" ]; then
            echo "Error: No successful run-tests.yml run found on branch ${{ env.BRANCH }}"
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT
          echo "Using run ID: $run_id"

      - name: Download liquibase-artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: liquibase-artifacts
          path: re-version/final
          run-id: ${{ steps.get-run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Unsigned Windows Installer
        env:
          INSTALL4J_LICENSE_KEY: ${{ env.INSTALL4J_LICENSE }}
        run: |
          tarFile=$(pwd)/re-version/final/liquibase-${BRANCH}-SNAPSHOT.tar.gz
          scriptDir=$(pwd)/.github/util/

          mkdir -p liquibase-dist/target/liquibase-0-SNAPSHOT
          (cd liquibase-dist/target/liquibase-0-SNAPSHOT && tar xfz $tarFile)
          (cd liquibase-dist && $scriptDir/package-install4j.sh 0-SNAPSHOT)
          mv liquibase-dist/target/liquibase-*-installer-* re-version/final

      - name: Find Unsigned Windows Installer
        id: find-installer
        run: |
          INSTALLER_PATH=$(find re-version/final -name "liquibase-*-installer-*" | head -n 1)
          if [ -z "$INSTALLER_PATH" ]; then
            echo "Error: No installer file found!"
            exit 1
          fi
          echo "Found installer: $INSTALLER_PATH"
          echo "INSTALLER_PATH=$INSTALLER_PATH" >> $GITHUB_ENV

      - name: GPG Sign Artifacts
        env:
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
        run: |
          .github/util/sign-artifacts.sh re-version/final

      - name: Re-version Installers
        run: |
          (cd re-version/final && zip liquibase-additional-0-SNAPSHOT.zip *.asc *.md5 *.sha1 *.sha256)
          rm re-version/final/*.asc
          rm re-version/final/*.md5
          rm re-version/final/*.sha1
          rm re-version/final/*.sha256

      - name: Archive Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-test-packages
          path: re-version/final/*
