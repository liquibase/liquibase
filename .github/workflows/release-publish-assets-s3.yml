name: Release Publish Assets to R2

run-name: "Publish Assets to R2 - v${{ inputs.version }}${{ inputs.dry_run && ' (Dry Run)' || '' }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run"
        required: false
        type: boolean
        default: false
  
      approved:
        description: "True only when release-published-orchestrator has already cleared the manual-approval gate for this run."
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-assets-s3:
    name: Publish OSS released assets to R2 bucket liquibase-oss-released-assets
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == false }}
    # `approved` is `workflow_call`-only, so a direct dispatch cannot claim it and still meets the
    # reviewers on `release`. An orchestrated run cleared that gate once already.
    # Keep it that way: on `workflow_dispatch` anyone who can dispatch could pick `release-publish`,
    # and a non-`boolean` input would do it silently because the string "false" is truthy.
    environment:
      name: ${{ inputs.approved && 'release-publish' || 'release' }}
    steps:
      - name: Download released assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "./${VERSION}-released-assets"
          gh release download "v${VERSION}" --repo liquibase/liquibase --pattern "*" --dir "./${VERSION}-released-assets"

      - name: Get current timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Configure AWS credentials for the cloudflare-r2 secret
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.VAULT_GROUPED_CLOUDFLARE_R2_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get the R2 access keys from vault
        # TECHOPS-1295: /vault/grouped/cloudflare-r2 holds exactly the keys this job uses,
        # so the whole secret is parsed into the job env and nothing else comes along.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/grouped/cloudflare-r2
          parse-json-secrets: true

      - name: Publish released assets to R2 bucket
        env:
          R2_AKID: ${{ env.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ env.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # R2 rejects a request carrying a session token; OIDC creds export one, so
          # drop it (and its legacy alias) before calling R2.
          unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          if [ -z "${R2_AKID:-}" ] || [ -z "${R2_SECRET:-}" ] || [ "$R2_ENDPOINT" = "https://.r2.cloudflarestorage.com" ]; then
            echo "::error::CLOUDFLARE_R2_ACCESS_KEY_ID / CLOUDFLARE_R2_SECRET_ACCESS_KEY / CLOUDFLARE_ACCOUNT_ID missing, cannot publish to R2."
            exit 1
          fi
          # CRC32: newer aws-cli defaults to a CRC64NVME checksum, which R2 rejects.
          AWS_ACCESS_KEY_ID="$R2_AKID" AWS_SECRET_ACCESS_KEY="$R2_SECRET" \
            aws s3 sync "./${{ inputs.version }}-released-assets" "s3://liquibase-oss-released-assets/oss-released-assets/${{ inputs.version }}-released-assets-${{ env.timestamp }}/" --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32 --only-show-errors
