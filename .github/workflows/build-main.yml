name: Build Main/Master SNAPSHOT

on:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * *"
  push:
    branches:
      - 'main'

# Deny by default so a new job cannot silently pick up the org-wide write default.
permissions: {}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    permissions:
      # Only what the checkout needs; this job publishes nothing, it just emits two outputs.
      contents: read
    outputs:
      timeStamp: ${{ steps.get-timestamp.outputs.timeStamp }}
      latestMergeSha: ${{ steps.get-sha.outputs.latestMergeSha }}
      setupSuccessful: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Latest Merge Commit SHA
        id: get-sha
        run: |
          latest_merge_sha=`(git rev-parse --short HEAD)`
          echo "latestMergeSha=${latest_merge_sha}" >> $GITHUB_OUTPUT

      - name: Get Timestamp
        id: get-timestamp
        run: |
          timestamp=`(date +'%Y-%m-%d %H:%M:%S %Z')`
          echo "timeStamp=${timestamp}" >> $GITHUB_OUTPUT


  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-22.04
    needs: setup
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java for publishing to GitHub Repository
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: liquibase

        # Publish main-SNAPSHOT version to GPM
      - name: Version Artifact as main-SNAPSHOT
        run: ./mvnw versions:set "-DnewVersion=main-SNAPSHOT"

      - name: Publish main-SNAPSHOT
        run: ./mvnw -B clean deploy -pl '!liquibase-dist' -DskipTests=true "-Dbuild.repository.owner=liquibase" "-Dbuild.repository.name=liquibase" "-Dbuild.branch=main" "-Dbuild.number=${{ github.run_number }}" "-Dbuild.commit=${{ needs.setup.outputs.latestMergeSha }}" "-Dbuild.timestamp=${{ needs.setup.outputs.timeStamp }}"

      # Publish <commitsha>-SNAPSHOT version to GPM
      - name: Version Artifact as commit-SNAPSHOT
        run: ./mvnw versions:set -DnewVersion="${{ needs.setup.outputs.latestMergeSha }}-SNAPSHOT"

      - name: Publish commit-SNAPSHOT
        run: ./mvnw -B clean deploy -pl '!liquibase-dist' -DskipTests=true "-Dbuild.repository.owner=liquibase" "-Dbuild.repository.name=liquibase" "-Dbuild.branch=main" "-Dbuild.number=${{ github.run_number }}" "-Dbuild.commit=${{ needs.setup.outputs.latestMergeSha }}" "-Dbuild.timestamp=${{ needs.setup.outputs.timeStamp }}"
