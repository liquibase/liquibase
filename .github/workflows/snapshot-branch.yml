name: Snapshot Branch

# Maintainer-only: build any ref and publish <full-sha>-SNAPSHOT plus the
# liquibase-zip-<branch> / liquibase-artifacts-<branch> run artifacts that
# liquibase-sdk-maven-plugin (liquibase-pro-tests, liquibase-test-harness)
# downloads with `-Dliquibase.sdk.workflowId=snapshot-branch.yml`.
# workflow_dispatch only (requires write access); never runs on a PR event, so
# there is no PR payload and no fork ref can reach it. No vault, no signing.
# Replaces the per-PR branch publishing in build-branch.yml / build.yml.
# [TECHOPS-1104]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA in liquibase/liquibase to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: snapshot-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.ref }} SNAPSHOT
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }} # setup-java server-id credentials for GitHub Packages
      # Run steps read the ref through $REF, never by direct ${{ }} interpolation
      # into the script: dispatch needs write access, but env indirection keeps a
      # crafted ref name from being parsed as shell.
      REF: ${{ inputs.ref }}
      MAVEN_BUILD_ARGS: >-
        -Dbuild.repository.owner=liquibase
        -Dbuild.repository.name=liquibase
        -Dbuild.branch=${{ inputs.ref }}
        -Dbuild.number=${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve SHA and branch name
        run: |
          {
            echo "BUILD_SHA=$(git rev-parse HEAD)"
            echo "BUILD_TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S %Z')"
            # same munging as build.yml used, which is what the sdk plugin expects
            echo "BRANCH_FILE=$(tr '/' '_' <<<"$REF")"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: liquibase

      - name: Build distribution (0-SNAPSHOT)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # MAVEN_BUILD_ARGS is intentionally word-split
          ./mvnw -B $MAVEN_BUILD_ARGS "-Dbuild.commit=$BUILD_SHA" "-Dbuild.timestamp=$BUILD_TIMESTAMP" -DskipTests \
            -pl liquibase-dist,liquibase-maven-plugin,liquibase-extension-testing -am clean package

          mkdir -p branch-artifacts artifacts-named
          tar -xzf liquibase-dist/target/liquibase-0-SNAPSHOT.tar.gz -C branch-artifacts
          cp liquibase-dist/target/liquibase-0-SNAPSHOT.tar.gz "artifacts-named/liquibase-${BRANCH_FILE}.tar.gz"
          cp liquibase-extension-testing/target/liquibase-extension-testing-0-SNAPSHOT-deps.jar "artifacts-named/liquibase-extension-testing-${BRANCH_FILE}-deps.jar"
          for i in liquibase-core liquibase-maven-plugin liquibase-cli liquibase-extension-testing; do
            cp "$i/target/$i-0-SNAPSHOT.jar" "artifacts-named/$i-${BRANCH_FILE}.jar"
          done

      - name: Upload liquibase-zip-${{ inputs.ref }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-zip-${{ env.BRANCH_FILE }}
          path: branch-artifacts/*

      - name: Upload liquibase-artifacts-${{ inputs.ref }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquibase-artifacts-${{ env.BRANCH_FILE }}
          path: artifacts-named/*

      - name: Publish <sha>-SNAPSHOT to GitHub Packages
        run: |
          # Full 40-char SHA: liquibase-test-harness resolves community builds by
          # matching <full-sha>-SNAPSHOT in GitHub Packages metadata.
          ./mvnw -B versions:set -DnewVersion="${BUILD_SHA}-SNAPSHOT"
          # shellcheck disable=SC2086 # MAVEN_BUILD_ARGS is intentionally word-split
          ./mvnw -B $MAVEN_BUILD_ARGS "-Dbuild.commit=$BUILD_SHA" "-Dbuild.timestamp=$BUILD_TIMESTAMP" -DskipTests -pl '!liquibase-dist' deploy

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<MSG
          ## Published \`${BUILD_SHA}-SNAPSHOT\`
          Repository: https://maven.pkg.github.com/liquibase/liquibase
          Run artifacts: \`liquibase-zip-${BRANCH_FILE}\`, \`liquibase-artifacts-${BRANCH_FILE}\` (sdk plugin: \`-Dliquibase.sdk.workflowId=snapshot-branch.yml -Dliquibase.sdk.branchSearch=${REF}\`)
          Test harness: dispatch \`liquibase-test-harness/main.yml\` with \`liquibaseRepo=liquibase/liquibase\`, \`liquibaseCommit=${BUILD_SHA}\`.
          MSG
