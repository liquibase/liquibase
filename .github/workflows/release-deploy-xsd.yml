name: Release Deploy XSD

run-name: "Deploy XSD Files - v${{ inputs.version }}${{ inputs.dry_run && ' (Dry Run)' || '' }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run"
        required: false
        type: boolean
        default: false
  
      approved:
        description: "True only when release-published-orchestrator has already cleared the manual-approval gate for this run."
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      dry_run:
        description: "Flag to indicate if this is a dry-run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-xsd:
    name: Upload xsds
    runs-on: ubuntu-22.04
    if: ${{ inputs.dry_run == false }}
    # `approved` is `workflow_call`-only, so a direct dispatch cannot claim it and still meets the
    # reviewers on `release`. An orchestrated run cleared that gate once already.
    # Keep it that way: on `workflow_dispatch` anyone who can dispatch could pick `release-publish`,
    # and a non-`boolean` input would do it silently because the string "false" is truthy.
    environment:
      name: ${{ inputs.approved && 'release-publish' || 'release' }}
    steps:
      - name: Download liquibase xsd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs no networked git command, so the token does not need to
          # sit in .git/config. [TECHOPS-1111]
          persist-credentials: false
          # Relative path under $GITHUB_WORKSPACE to place the repository
          path: liquibase-core-repo
          repository: "liquibase/liquibase"

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_RELEASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1107: aws-secretsmanager-get-secrets can only load a secret whole, so
        # read the JSON directly and pull only the WPEngine SFTP keys needed.
        # TECHOPS-1320: dropped the build-logic AWS role; its S3 write duplicated what
        # this job already SFTPs to WPEngine below (see the PR description).
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value --secret-id /vault/liquibase --region us-east-1 --query SecretString --output text)
          for k in WPENGINE_SFTP_HOST WPENGINE_SFTP_HOST_KEY WPENGINE_SFTP_PASSWORD WPENGINE_SFTP_PORT WPENGINE_SFTP_USER; do
            # jq -j plus a sentinel: command substitution strips ALL trailing newlines,
            # which would silently alter a value that legitimately ends in one.
            v=$(printf '%s' "$JSON" | jq -j --arg k "$k" '.[$k] // ""'; printf 'X')
            v=${v%X}
            if [ -z "$v" ]; then echo "::error::$k missing from /vault/liquibase"; exit 1; fi
            # The runner unescapes %0D, %0A and %25 in command data, so a value carrying
            # those literals registers a mask that never matches it; % is escaped first
            # so the escapes the next two produce are not escaped again.
            e=$v; e=${e//'%'/%25}; e=${e//$'\r'/%0D}; e=${e//$'\n'/%0A}
            printf '::add-mask::%s\n' "$e"
            D="VAULT_EOF_${RANDOM}${RANDOM}"
            { echo "$k<<$D"; printf '%s\n' "$v"; echo "$D"; } >> "$GITHUB_ENV"
          done
          unset JSON

      # WPEngine only accepts files via SFTP, so S3-direct is not an option here.
      # Replaced third-party SFTP action with sshpass + sftp CLI to reduce supply chain risk.
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure WPEngine known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.WPENGINE_SFTP_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Liquibase xsds SFTP upload
        env:
          SSHPASS: ${{ env.WPENGINE_SFTP_PASSWORD }}
          SFTP_USER: ${{ env.WPENGINE_SFTP_USER }}
          SFTP_HOST: ${{ env.WPENGINE_SFTP_HOST }}
          SFTP_PORT: ${{ env.WPENGINE_SFTP_PORT }}
        run: |
          sshpass -e sftp -P "$SFTP_PORT" -oCompression=yes -oStrictHostKeyChecking=yes "$SFTP_USER@$SFTP_HOST" <<'SFTP_EOF'
          put -r liquibase-core-repo/liquibase-standard/src/main/resources/www.liquibase.org/xml/ns/dbchangelog/* /xml/ns/dbchangelog/
          bye
          SFTP_EOF

      - name: Prepare updated index.htm
        # Fetches index.htm from WPEngine (customers' actual copy) and adds the new
        # xsd version if not listed; previously round-tripped through S3, which nothing read.
        env:
          VERSION: ${{ inputs.version }}
          SSHPASS: ${{ env.WPENGINE_SFTP_PASSWORD }}
          SFTP_USER: ${{ env.WPENGINE_SFTP_USER }}
          SFTP_HOST: ${{ env.WPENGINE_SFTP_HOST }}
          SFTP_PORT: ${{ env.WPENGINE_SFTP_PORT }}
        run: |
          set -euo pipefail
          # inputs.version is dispatch-controlled; read via env and validated before
          # use, never interpolated straight into the script.
          version="$VERSION"
          IFS='.' read -r major minor _ <<< "$version"
          if [[ ! $major =~ ^[0-9]+$ || ! $minor =~ ^[0-9]+$ ]]; then
            echo "::error::version must start with numeric major.minor components, got '$version'"
            exit 1
          fi
          xsd_version="${major}.${minor}"
          mkdir index-file
          # -b - makes a failed/partial `get` exit non-zero; plain stdin-piped sftp
          # prints the error and continues to `bye`, exiting 0 regardless. set -e then
          # stops this step, and the unconditional upload after it, on a truncated file.
          sshpass -e sftp -b - -P "$SFTP_PORT" -oStrictHostKeyChecking=yes "$SFTP_USER@$SFTP_HOST" <<'SFTP_EOF'
          get /xml/ns/dbchangelog/index.htm index-file/index.htm
          bye
          SFTP_EOF
          # Defense in depth on top of -b -: refuse unless the download looks like the
          # real listing, since this file gets SFTP'd back to the live site next.
          if [ ! -s index-file/index.htm ]; then
            echo "::error::downloaded index.htm is empty or missing, refusing to publish"
            exit 1
          fi
          if ! grep -q '</ul>' index-file/index.htm; then
            echo "::error::downloaded index.htm is missing the expected </ul> listing marker, refusing to publish"
            exit 1
          fi
          # Match the full filename, not a version substring: "4.2" would also match
          # "dbchangelog-4.20.xsd" and wrongly skip that entry. The full ".xsd"-included
          # string only lines up when the major.minor is exact.
          if ! grep -Fq "dbchangelog-${xsd_version}.xsd" index-file/index.htm ; then
            sed -ie "s/<\/ul>/  <li><a href=\"\/xml\/ns\/dbchangelog\/dbchangelog-${xsd_version}.xsd\">dbchangelog-${xsd_version}.xsd<\/a><\/li>\n<\/ul>/" index-file/index.htm
          fi

      - name: Liquibase index.htm SFTP upload
        env:
          SSHPASS: ${{ env.WPENGINE_SFTP_PASSWORD }}
          SFTP_USER: ${{ env.WPENGINE_SFTP_USER }}
          SFTP_HOST: ${{ env.WPENGINE_SFTP_HOST }}
          SFTP_PORT: ${{ env.WPENGINE_SFTP_PORT }}
        run: |
          sshpass -e sftp -P "$SFTP_PORT" -oStrictHostKeyChecking=yes "$SFTP_USER@$SFTP_HOST" <<'SFTP_EOF'
          put index-file/index.htm /xml/ns/dbchangelog/index.htm
          bye
          SFTP_EOF
